name: Run MCP Supabase Server

on:
  push:
    branches:
      - claude/mcp-supabase-setup-lxbhp9
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: claude/mcp-supabase-setup-lxbhp9
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build project
        run: npm run build
      
      - name: Run MCP Supabase Server
