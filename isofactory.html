<!DOCTYPE html>
<html lang="en">
<head>
<!-- Built by build.js from the modules in js/ — do not edit by hand.
     Sources: js/iso.js, js/entities.js, js/engine.js, js/products.js, js/economy.js, js/binding.js, js/audio.js, js/ui.js -->
<meta charset="utf-8" />
<!-- Browser zoom stays available; the canvas blocks pinch on itself via
     touch-action so gameplay panning never fights the page. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070a0e" />
<title>ISO FACTORY</title>
<style>
/* =====================================================================
   ISO FACTORY — dark industrial theme
   Canvas fills the viewport; the shell floats above it. Layout is
   bottom-anchored so the factory stays visible while panels are open,
   and thumbs reach the controls on a phone.
   ===================================================================== */

:root{
  --bg-void:      #070a0e;
  --bg-panel:     rgba(14, 19, 27, .92);
  --bg-row:       rgba(255,255,255,.035);
  --bg-row-hi:    rgba(255,255,255,.07);
  --line:         rgba(120, 160, 200, .14);
  --line-strong:  rgba(140, 190, 240, .30);
  --text:         #d6e2f0;
  --text-dim:     #8195ab;
  --text-faint:   #5b6b7d;
  --accent:       #ffc832;
  --accent-dim:   rgba(255, 200, 50, .16);
  --cyan:         #38d9d0;
  --good:         #7dffb0;
  --warn:         #ffb347;
  --bad:          #ff5f56;
  --r:            12px;
  --font-ui:      "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono:    "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --sheet-h:      min(46vh, 380px);
}

*{ box-sizing:border-box; margin:0; padding:0; }

/* A class that sets `display` outranks the UA rule for [hidden], which
   would otherwise leave invisible full-screen layers swallowing clicks. */
[hidden]{ display:none !important; }

html, body{
  width:100%; height:100%; overflow:hidden;
  background:var(--bg-void); color:var(--text);
  font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;
  user-select:none; -webkit-tap-highlight-color:transparent;
}

button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
h2{ font-size:13px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }

/* ---------------------------------------------------------------- stage */
#stage{
  position:fixed; inset:0;
  background:radial-gradient(1200px 800px at 50% 38%, #131c27 0%, #0a0e14 62%, #06090d 100%);
}
#factory-canvas{
  position:absolute; inset:0; width:100%; height:100%;
  display:block; cursor:grab; touch-action:none;
}
#factory-canvas.dragging{ cursor:grabbing; }

.fx-vignette{
  position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(circle at 50% 45%,
              rgba(0,0,0,0) 42%, rgba(0,0,0,.42) 78%, rgba(0,0,0,.72) 100%);
}
.fx-scanlines{
  position:absolute; inset:0; pointer-events:none; opacity:.22;
  background:repeating-linear-gradient(to bottom,
              rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
  mix-blend-mode:overlay;
}

/* =========================================================== HEADER === */
#hud{
  position:absolute; top:0; left:0; right:0;
  padding:10px 12px 0; pointer-events:none;
  display:flex; flex-direction:column; gap:8px;
  background:linear-gradient(to bottom, rgba(6,9,13,.94), rgba(6,9,13,0));
}

.hud-bar{ display:flex; align-items:center; gap:12px; }

.brand{ display:flex; align-items:center; gap:8px; }
.brand-mark{
  width:11px; height:11px; transform:rotate(45deg); background:var(--accent);
  box-shadow:0 0 14px var(--accent), inset 0 0 0 2px rgba(0,0,0,.35);
}
.brand-name{ font-size:13px; font-weight:800; letter-spacing:.16em; }
.brand-name em{ font-style:normal; color:var(--accent); }

/* ---- wallet ---- */
.wallet{ display:flex; flex-direction:column; margin-left:auto; text-align:right; line-height:1.15; }
.wallet b{
  font-family:var(--font-mono); font-size:20px; font-weight:700;
  color:var(--accent); letter-spacing:.02em;
  text-shadow:0 0 22px rgba(255,200,50,.35);
}
.wallet span{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); }

/* ---- level ---- */
.level{ display:flex; flex-direction:column; gap:4px; align-items:flex-end; }
.level-badge{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.12em;
  color:var(--text-dim); padding:3px 8px; border-radius:999px;
  background:var(--bg-panel); border:1px solid var(--line);
}
.level-badge b{ color:var(--text); font-size:12px; }
.level-meter{
  width:74px; height:4px; border-radius:2px; overflow:hidden;
  background:rgba(255,255,255,.09);
}
.level-meter i{
  display:block; height:100%; width:0;
  background:linear-gradient(90deg, var(--cyan), #8ad0ff);
  transition:width .3s ease;
}
.level.pulse .level-badge{
  animation:pop .9s ease; border-color:var(--accent); color:var(--accent);
}
@keyframes pop{ 0%{transform:scale(1)} 30%{transform:scale(1.22)} 100%{transform:scale(1)} }

.icon-btn{
  pointer-events:auto; width:34px; height:34px; border-radius:10px;
  display:grid; place-items:center; font-size:15px;
  background:var(--bg-panel); border:1px solid var(--line);
  transition:border-color .15s, transform .1s;
}
.icon-btn:hover{ border-color:var(--line-strong); }
.icon-btn:active{ transform:scale(.94); }

/* ---- objective banner ---- */
.objective{
  pointer-events:auto; display:flex; align-items:center; gap:10px;
  padding:7px 12px; border-radius:var(--r);
  background:var(--bg-panel); border:1px solid var(--line);
  backdrop-filter:blur(8px);
}
.obj-tag{
  font-family:var(--font-mono); font-size:9px; letter-spacing:.18em;
  color:var(--accent); padding:2px 6px; border-radius:4px;
  background:var(--accent-dim); flex:none;
}
.obj-name{
  font-size:12px; font-weight:600; flex:1 1 auto;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.obj-meter{
  flex:0 0 90px; height:5px; border-radius:3px; overflow:hidden;
  background:rgba(255,255,255,.09);
}
.obj-meter i{
  display:block; height:100%; width:0;
  background:linear-gradient(90deg, var(--accent), #ffe08a);
  transition:width .3s ease;
}
.obj-count{ font-family:var(--font-mono); font-size:10px; color:var(--text-dim); flex:none; }
.obj-reward{ font-family:var(--font-mono); font-size:10px; color:var(--good); flex:none; }

/* ---- active booster pills ---- */
.boost-strip{ display:flex; gap:6px; flex-wrap:wrap; }
.boost-pill{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.04em;
  padding:3px 9px; border-radius:999px; color:var(--c, var(--accent));
  background:color-mix(in srgb, var(--c, #ffc832) 14%, transparent);
  border:1px solid color-mix(in srgb, var(--c, #ffc832) 42%, transparent);
  animation:fadein .25s ease;
}
.boost-pill b{ color:var(--text); }

/* ---- diagnostics ---- */
.diag{ position:absolute; top:56px; left:12px; display:flex; gap:6px; }
.chip{
  font-family:var(--font-mono); font-size:10px; color:var(--text-dim);
  padding:3px 8px; border-radius:999px;
  background:var(--bg-panel); border:1px solid var(--line);
}
.chip b{ color:var(--text); }

/* ============================================================ SHEET === */
.sheet{
  position:absolute; left:50%; bottom:60px;
  width:min(760px, calc(100% - 20px));
  transform:translate(-50%, calc(100% + 70px));
  height:var(--sheet-h);
  display:flex; flex-direction:column;
  background:var(--bg-panel); backdrop-filter:blur(14px);
  border:1px solid var(--line); border-radius:16px;
  box-shadow:0 -18px 50px rgba(0,0,0,.55);
  transition:transform .28s cubic-bezier(.22,.9,.3,1), opacity .2s;
  opacity:0; pointer-events:none; overflow:hidden;
}
.sheet.open{ transform:translate(-50%, 0); opacity:1; pointer-events:auto; }

.panel{ display:flex; flex-direction:column; min-height:0; height:100%; }
.panel[hidden]{ display:none; }

.panel-head{
  display:flex; align-items:center; gap:10px;
  padding:12px 14px 10px; border-bottom:1px solid var(--line);
}
.panel-head h2{ margin-right:auto; }
.panel-note{ font-family:var(--font-mono); font-size:10px; color:var(--text-dim); }

.rows{ overflow-y:auto; overscroll-behavior:contain; padding:8px; display:flex; flex-direction:column; gap:6px; }
.rows::-webkit-scrollbar{ width:8px; }
.rows::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.12); border-radius:4px; }

/* ---- buy amount selector ---- */
.buyamt{ display:flex; gap:2px; padding:2px; border-radius:9px; background:rgba(0,0,0,.35); border:1px solid var(--line); }
.buyamt button{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em;
  padding:4px 10px; border-radius:7px; color:var(--text-dim);
}
.buyamt button.on{ background:var(--accent); color:#1a1405; font-weight:700; }

/* ---- product rows ---- */
.prow{
  display:flex; align-items:center; gap:11px; text-align:left;
  padding:9px 11px; border-radius:10px;
  background:var(--bg-row); border:1px solid transparent;
  transition:background .15s, border-color .15s;
}
.prow:hover{ background:var(--bg-row-hi); }
.prow.active{ border-color:var(--line-strong); background:rgba(255,200,50,.07); }
.prow.locked{ opacity:.55; }
.prow.ready{ opacity:1; border-color:rgba(255,200,50,.45); }

.pswatch{
  width:12px; height:12px; flex:none; transform:rotate(45deg);
  background:var(--c); border-radius:2px;
  box-shadow:0 0 12px color-mix(in srgb, var(--c) 60%, transparent);
}
.pmain{ display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; }
.pname{ font-size:13px; font-weight:600; display:flex; align-items:center; gap:7px; }
.pstars{ font-style:normal; font-size:9px; color:var(--accent); letter-spacing:.05em; }
.psub{
  font-family:var(--font-mono); font-size:10px; color:var(--text-dim);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.pright{ display:flex; flex-direction:column; align-items:flex-end; gap:3px; flex:none; }
.prate{ font-family:var(--font-mono); font-size:11px; color:var(--good); }
.pcta{
  font-family:var(--font-mono); font-size:9.5px; letter-spacing:.1em;
  padding:3px 9px; border-radius:6px; color:var(--text-dim);
  border:1px solid var(--line);
}
.prow.ready .pcta{ background:var(--accent); color:#1a1405; font-weight:700; border-color:transparent; }
.prow.active .pcta{ color:var(--accent); border-color:rgba(255,200,50,.4); }

/* ---- line summary ---- */
.line-summary{
  display:grid; grid-template-columns:repeat(4, 1fr); gap:6px;
  padding:10px 12px; border-bottom:1px solid var(--line);
}
.line-summary span{
  display:flex; flex-direction:column; gap:2px;
  font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint);
}
.line-summary b{ font-family:var(--font-mono); font-size:13px; color:var(--text); letter-spacing:0; }

/* ---- axis rows ---- */
.arow{
  padding:10px 12px; border-radius:10px;
  background:var(--bg-row); border:1px solid transparent;
}
.arow.maxed{ border-color:rgba(125,255,176,.28); }
.ahead{ display:flex; align-items:baseline; gap:8px; }
.aname{ font-size:12.5px; font-weight:600; }
.alvl{ font-family:var(--font-mono); font-size:10.5px; color:var(--accent); margin-left:auto; }
.adesc{ font-size:10px; color:var(--text-faint); margin-top:2px; }
.ameter{ height:5px; border-radius:3px; background:rgba(255,255,255,.08); overflow:hidden; margin:8px 0 7px; }
.ameter i{
  display:block; height:100%; width:0;
  background:linear-gradient(90deg, var(--cyan), var(--accent));
  transition:width .25s ease;
}
.afoot{ display:flex; align-items:center; gap:10px; }
.amult{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); }
.abuy{
  margin-left:auto; font-family:var(--font-mono); font-size:11px;
  padding:6px 13px; border-radius:8px; color:var(--text-dim);
  background:rgba(255,255,255,.05); border:1px solid var(--line);
  transition:transform .1s, background .15s;
}
.abuy.afford{ background:var(--accent); color:#1a1405; font-weight:700; border-color:transparent; }
.abuy:active{ transform:scale(.95); }
.abuy:disabled{ opacity:.5; cursor:default; }

/* ============================================================= TABS === */
#tabs{
  position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
  display:flex; gap:6px; padding:5px;
  background:var(--bg-panel); backdrop-filter:blur(10px);
  border:1px solid var(--line); border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.tab{
  display:flex; align-items:center; gap:7px;
  padding:9px 16px; border-radius:10px;
  font-size:10.5px; font-weight:700; letter-spacing:.12em; color:var(--text-dim);
  transition:background .15s, color .15s, transform .1s;
}
.tab .tab-ico{ font-size:12px; }
.tab:hover{ color:var(--text); background:rgba(255,255,255,.05); }
.tab.on{ background:var(--accent); color:#1a1405; }
.tab:active{ transform:scale(.96); }

/* =========================================================== MODALS === */
.modal-layer{
  position:absolute; inset:0; z-index:20;
  display:grid; place-items:center; padding:16px;
  background:rgba(4,7,11,.72); backdrop-filter:blur(4px);
  opacity:0; transition:opacity .18s ease;
}
.modal-layer.in{ opacity:1; }
.modal{
  width:min(520px, 100%); max-height:80vh; overflow:hidden;
  display:flex; flex-direction:column;
  background:var(--bg-panel); border:1px solid var(--line-strong);
  border-radius:18px; box-shadow:0 24px 70px rgba(0,0,0,.6);
  transform:translateY(14px) scale(.98); transition:transform .22s cubic-bezier(.22,.9,.3,1);
}
.modal.narrow{ width:min(380px, 100%); text-align:center; padding-bottom:18px; }
.modal-layer.in .modal{ transform:none; }
.modal-head{ display:flex; align-items:center; padding:16px 16px 8px; }
.modal-head h2{ margin-right:auto; }
.modal-sub{ padding:0 16px 12px; font-size:11.5px; color:var(--text-dim); }
.modal-fine{ padding:6px 20px 14px; font-size:10.5px; color:var(--text-faint); font-family:var(--font-mono); }

.offline-take{
  font-family:var(--font-mono); font-size:34px; font-weight:700; color:var(--accent);
  text-shadow:0 0 30px rgba(255,200,50,.35); padding:6px 0 2px;
}

.cta{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; font-weight:700;
  padding:9px 16px; border-radius:9px;
  background:rgba(255,255,255,.06); border:1px solid var(--line); color:var(--text-dim);
  transition:transform .1s, background .15s;
}
.cta.afford{ background:var(--accent); color:#1a1405; border-color:transparent; }
.cta:active{ transform:scale(.96); }
.cta.wide{ margin:4px 20px 0; background:var(--accent); color:#1a1405; border-color:transparent; }

/* ---- booster rows ---- */
.brow{
  display:flex; align-items:center; gap:11px;
  padding:11px 12px; border-radius:10px;
  background:var(--bg-row); border:1px solid transparent;
}
.brow.active{
  border-color:color-mix(in srgb, var(--c) 55%, transparent);
  background:color-mix(in srgb, var(--c) 9%, transparent);
}
.brow.cooling{ opacity:.62; }
.bico{ font-size:20px; flex:none; filter:drop-shadow(0 0 8px color-mix(in srgb, var(--c) 55%, transparent)); }
.bmain{ display:flex; flex-direction:column; gap:3px; flex:1; min-width:0; }
.bname{ font-size:12.5px; font-weight:600; }
.bdesc{ font-family:var(--font-mono); font-size:10px; color:var(--text-dim); }
.bmeter{ height:4px; border-radius:2px; background:rgba(255,255,255,.08); overflow:hidden; margin-top:3px; }
.bmeter i{ display:block; height:100%; width:0; background:var(--c); transition:width .3s linear; }
.bcta{ flex:none; min-width:96px; text-align:center; }

/* =========================================================== TOASTS === */
#toasts{
  position:absolute; left:50%; transform:translateX(-50%);
  bottom:calc(60px + var(--sheet-h) + 14px);
  display:flex; flex-direction:column; gap:6px; align-items:center;
  pointer-events:none; z-index:15; width:max-content; max-width:90vw;
}
.toast{
  font-family:var(--font-mono); font-size:11px;
  padding:8px 14px; border-radius:999px;
  background:rgba(14,19,27,.96); border:1px solid var(--line);
  box-shadow:0 8px 26px rgba(0,0,0,.5);
  opacity:0; transform:translateY(8px); transition:opacity .22s, transform .22s;
}
.toast.in{ opacity:1; transform:none; }
.toast.good{ border-color:rgba(125,255,176,.45); color:var(--good); }
.toast.warn{ border-color:rgba(255,179,71,.45); color:var(--warn); }

@keyframes fadein{ from{ opacity:0; transform:translateY(-4px);} to{ opacity:1; } }

/* ============================================================ SMALL === */
@media (max-width:640px){
  :root{ --sheet-h:min(52vh, 400px); }
  .brand-name{ display:none; }
  .wallet b{ font-size:17px; }
  .objective{ gap:7px; padding:6px 9px; }
  .obj-meter{ flex-basis:52px; }
  .obj-reward{ display:none; }
  .tab span:not(.tab-ico){ display:none; }
  .tab{ padding:10px 20px; }
  .tab .tab-ico{ font-size:15px; }
  .line-summary{ grid-template-columns:repeat(2, 1fr); }
}

@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>

<div id="stage">
  <!-- ============================ WORLD ============================ -->
  <canvas id="factory-canvas"
          aria-label="Isometric factory floor: conveyor lines, robotic arms and loading docks">
    Isometric factory view. This game requires canvas support.
  </canvas>

  <div class="fx-vignette" aria-hidden="true"></div>
  <div class="fx-scanlines" aria-hidden="true"></div>

  <!-- ============================ HEADER =========================== -->
  <header id="hud">
    <div class="hud-bar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">ISO<em>FACTORY</em></span>
      </div>

      <div class="wallet">
        <b id="ui-cash">$0</b>
        <span id="ui-rate">$0/min</span>
      </div>

      <div class="level" id="ui-level-wrap" title="Player level">
        <span class="level-badge">LV <b id="ui-level">1</b></span>
        <span class="level-meter"><i id="ui-xp"></i></span>
      </div>

      <button class="icon-btn" id="ui-mute" type="button"
              aria-pressed="false" title="Mute (M)">
        <span id="ui-mute-icon">🔊</span>
      </button>
    </div>

    <!-- objective banner -->
    <div class="objective" id="ui-objective">
      <span class="obj-tag">OBJECTIVE</span>
      <span class="obj-name" id="ui-obj-name">—</span>
      <span class="obj-meter"><i id="ui-obj-fill"></i></span>
      <span class="obj-count" id="ui-obj-count"></span>
      <span class="obj-reward" id="ui-obj-reward"></span>
    </div>

    <!-- active booster pills -->
    <div class="boost-strip" id="ui-boost-strip"></div>
  </header>

  <!-- diagnostics, toggled with D -->
  <div class="diag" id="ui-diag" hidden>
    <span class="chip"><b id="stat-fps">0</b> fps</span>
    <span class="chip"><b id="stat-draws">0</b> draws</span>
    <span class="chip"><b id="stat-ents">0</b> ents</span>
    <span class="chip"><b id="stat-zoom">1.00</b>×</span>
  </div>

  <!-- ======================== BOTTOM SHEET ========================= -->
  <section id="sheet" class="sheet" aria-live="polite">
    <!-- ---------- PRODUCTS ---------- -->
    <div class="panel" id="panel-products" data-panel="products">
      <div class="panel-head">
        <h2>Products</h2>
        <span class="panel-note" id="ui-lines-note">1 / 8 lines</span>
      </div>
      <div class="rows" id="ui-product-rows"></div>
    </div>

    <!-- ---------- FACTORY ---------- -->
    <div class="panel" id="panel-factory" data-panel="factory" hidden>
      <div class="panel-head">
        <h2 id="ui-factory-title">Factory</h2>
        <div class="buyamt" id="ui-buyamt" role="group" aria-label="Buy amount">
          <button type="button" data-amt="1" class="on">×1</button>
          <button type="button" data-amt="10">×10</button>
          <button type="button" data-amt="max">MAX</button>
        </div>
      </div>
      <div class="line-summary" id="ui-line-summary"></div>
      <div class="rows" id="ui-axis-rows"></div>
    </div>
  </section>

  <!-- ============================= TABS ============================ -->
  <nav id="tabs" aria-label="Main navigation">
    <button class="tab" type="button" data-tab="products">
      <span class="tab-ico">▦</span><span>PRODUCTS</span>
    </button>
    <button class="tab" type="button" data-tab="factory">
      <span class="tab-ico">⚙</span><span>FACTORY</span>
    </button>
    <button class="tab" type="button" data-tab="boosters">
      <span class="tab-ico">⚡</span><span>BOOSTERS</span>
    </button>
  </nav>

  <!-- =========================== MODALS ============================ -->
  <div class="modal-layer" id="modal-boosters" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="boost-title">
      <div class="modal-head">
        <h2 id="boost-title">⚡ Boosters</h2>
        <button class="icon-btn" type="button" data-close>✕</button>
      </div>
      <p class="modal-sub">Free surges on a cooldown. Stack them.</p>
      <div class="rows" id="ui-booster-rows"></div>
    </div>
  </div>

  <div class="modal-layer" id="modal-offline" hidden>
    <div class="modal narrow" role="dialog" aria-modal="true" aria-labelledby="off-title">
      <div class="modal-head">
        <h2 id="off-title">Welcome back</h2>
      </div>
      <p class="modal-sub" id="ui-offline-away">—</p>
      <div class="offline-take" id="ui-offline-amount">$0</div>
      <p class="modal-fine" id="ui-offline-fine"></p>
      <button class="cta wide" type="button" id="ui-offline-collect">COLLECT</button>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>
</div>

<!-- Load order matters.
     Renderer:  math → primitives → entities → engine
     Economy:   content registry → mutable state → engine binding
     Shell:     audio synth → UI overlay (boots last, wires everything) -->
<script>
/* ===== js/iso.js ===================================================== */
/* =====================================================================
   iso.js — Isometric projection math, camera, colour utilities and the
   procedural drawing primitives every entity is built from.
   ---------------------------------------------------------------------
   COORDINATE CONTRACT
     grid  (gx, gy, gz)  gx → screen right+down, gy → screen left+down,
                         gz → screen up. 1 unit = 1 tile. Floats allowed.
     screen(sx, sy)      world-space pixels BEFORE the camera transform.

     sx = (gx - gy) * TILE_W/2
     sy = (gx + gy) * TILE_H/2 - gz * Z_UNIT

   DEPTH
     Painter's algorithm. A draw command's sort key is
        depth = (gx + gy)  ... primary   (further from camera = smaller)
        then z, then layer, then insertion index (stable).
     Entities may emit many commands so tall objects interleave correctly
     with the tiles and items around them.
   ===================================================================== */
(function (global) {
  'use strict';

  /* ------------------------------------------------------------------ */
  /*  math helpers                                                       */
  /* ------------------------------------------------------------------ */
  const M = {
    clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
    lerp: (a, b, t) => a + (b - a) * t,
    /** Frame-rate independent exponential smoothing. */
    damp: (a, b, lambda, dt) => a + (b - a) * (1 - Math.exp(-lambda * dt)),
    easeInOut: t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
    easeOut: t => 1 - Math.pow(1 - t, 3),
    easeIn: t => t * t * t,
    /** 0→1 ramp with smooth ends, saturating outside [a,b]. */
    smoothstep: (a, b, x) => {
      const t = M.clamp((x - a) / (b - a || 1e-6), 0, 1);
      return t * t * (3 - 2 * t);
    },
    /** Deterministic hash noise — stable layout jitter without RNG state. */
    hash: (x, y = 0) => {
      const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
      return s - Math.floor(s);
    },
    mod: (a, n) => ((a % n) + n) % n,
    dist: (x, y) => Math.sqrt(x * x + y * y)
  };

  /* ------------------------------------------------------------------ */
  /*  colour                                                             */
  /* ------------------------------------------------------------------ */
  const Color = {
    _cache: new Map(),

    /**
     * Parse "#rgb" / "#rrggbb" / "rgb(r,g,b)" → [r,g,b]. Cached — this runs
     * thousands of times per frame. Accepting rgb() back matters: shaded
     * results get re-shaded (a box face of an already-tinted crate), so
     * every producer below must emit something this can re-read.
     */
    rgb(col) {
      let c = Color._cache.get(col);
      if (c) return c;
      if (col.charCodeAt(0) === 114 /* r */) {          // rgb()/rgba()
        const m = col.match(/-?\d+(\.\d+)?/g) || [0, 0, 0];
        c = [+m[0] | 0, +m[1] | 0, +m[2] | 0];
      } else {
        let h = col.replace('#', '');
        if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
        const n = parseInt(h, 16) || 0;
        c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      }
      Color._cache.set(col, c);
      return c;
    },

    hex(r, g, b) {
      return '#' + (((1 << 24) + (M.clamp(r | 0, 0, 255) << 16) +
        (M.clamp(g | 0, 0, 255) << 8) + M.clamp(b | 0, 0, 255))
        .toString(16).slice(1));
    },

    /** amt > 0 lightens toward white, amt < 0 darkens toward black. */
    shade(col, amt) {
      const key = col + '|' + amt.toFixed(3);
      let out = Color._cache.get(key);
      if (out) return out;
      const [r, g, b] = Color.rgb(col);
      const t = amt < 0 ? 0 : 255;
      const p = Math.abs(amt);
      out = Color.hex(
        Math.round((t - r) * p + r),
        Math.round((t - g) * p + g),
        Math.round((t - b) * p + b));
      Color._cache.set(key, out);
      return out;
    },

    alpha(col, a) {
      const [r, g, b] = Color.rgb(col);
      return `rgba(${r},${g},${b},${a})`;
    },

    mix(colA, colB, t) {
      const a = Color.rgb(colA), b = Color.rgb(colB);
      return Color.hex(M.lerp(a[0], b[0], t), M.lerp(a[1], b[1], t),
        M.lerp(a[2], b[2], t));
    }
  };

  /* ------------------------------------------------------------------ */
  /*  Iso — the projection itself                                        */
  /* ------------------------------------------------------------------ */
  class Iso {
    constructor(tileW = 64, tileH = 32, zUnit = 32) {
      this.tileW = tileW;
      this.tileH = tileH;
      this.hw = tileW / 2;
      this.hh = tileH / 2;
      this.zUnit = zUnit;
    }

    /** grid → world-space screen pixels. */
    x(gx, gy) { return (gx - gy) * this.hw; }
    y(gx, gy, gz = 0) { return (gx + gy) * this.hh - gz * this.zUnit; }

    /** Convenience object form (allocates — avoid in hot inner loops). */
    project(gx, gy, gz = 0) {
      return { x: (gx - gy) * this.hw, y: (gx + gy) * this.hh - gz * this.zUnit };
    }

    /** Inverse projection onto the gz = 0 plane. Used for mouse picking. */
    unproject(sx, sy, gz = 0) {
      const y = sy + gz * this.zUnit;
      return {
        gx: (y / this.hh + sx / this.hw) / 2,
        gy: (y / this.hh - sx / this.hw) / 2
      };
    }

    /** Painter sort key. Higher = drawn later = closer to the camera. */
    depth(gx, gy, gz = 0, layer = 0) {
      return (gx + gy) * 1000 + gz * 10 + layer;
    }

    /** Screen bounds of a w×d footprint rising to height h at origin. */
    bounds(w, d, h = 0) {
      return {
        minX: this.x(0, d), maxX: this.x(w, 0),
        minY: this.y(0, 0, h), maxY: this.y(w, d, 0)
      };
    }
  }

  /* ------------------------------------------------------------------ */
  /*  Draw primitives                                                    */
  /*  All take (ctx, iso, ...) and paint in world-space screen pixels;    */
  /*  the camera transform is already applied by the renderer.           */
  /* ------------------------------------------------------------------ */

  /** Face brightness constants — one light source, high and to the left. */
  const FACE = { top: 0.16, left: -0.10, right: -0.34, front: -0.02 };

  /** Trace a polygon from an array of grid triples [[x,y,z], ...]. */
  function tracePoly(ctx, iso, pts) {
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      const X = iso.x(p[0], p[1]);
      const Y = iso.y(p[0], p[1], p[2]);
      i === 0 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y);
    }
    ctx.closePath();
  }

  function fillPoly(ctx, iso, pts, fill, stroke, lw) {
    tracePoly(ctx, iso, pts);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
  }

  /** Flat tile diamond at (x,y) of size w×d on plane z. */
  function diamond(ctx, iso, x, y, z, w, d, fill, stroke, lw) {
    fillPoly(ctx, iso, [
      [x, y, z], [x + w, y, z], [x + w, y + d, z], [x, y + d, z]
    ], fill, stroke, lw);
  }

  /**
   * The workhorse: an axis-aligned cuboid.
   * o = { x, y, z, w, d, h, color, top, left, right, outline, alpha }
   * Only the three camera-facing faces are emitted (top, left = +y face,
   * right = +x face) — back faces are never visible in a fixed iso view.
   */
  function box(ctx, iso, o) {
    const x = o.x, y = o.y, z = o.z || 0;
    const w = o.w, d = o.d, h = o.h;
    const c = o.color || '#888';
    const zt = z + h;

    if (o.alpha != null) { ctx.save(); ctx.globalAlpha *= o.alpha; }

    const line = o.outline === false ? null
      : (o.outline || Color.shade(c, -0.62));
    const lw = o.lineWidth || 1;

    // +x face (screen right)
    fillPoly(ctx, iso, [
      [x + w, y, zt], [x + w, y + d, zt], [x + w, y + d, z], [x + w, y, z]
    ], o.right || Color.shade(c, FACE.right), line, lw);

    // +y face (screen left / front)
    fillPoly(ctx, iso, [
      [x, y + d, zt], [x + w, y + d, zt], [x + w, y + d, z], [x, y + d, z]
    ], o.left || Color.shade(c, FACE.left), line, lw);

    // top
    if (h !== 0 || o.forceTop !== false) {
      fillPoly(ctx, iso, [
        [x, y, zt], [x + w, y, zt], [x + w, y + d, zt], [x, y + d, zt]
      ], o.top || Color.shade(c, FACE.top), line, lw);
    }

    if (o.alpha != null) ctx.restore();
  }

  /**
   * Vertical cylinder approximated with an ellipse cap + a body quad.
   * Used for arm bases, tanks, silos, exhaust stacks.
   */
  function cylinder(ctx, iso, cx, cy, z, r, h, color, opts) {
    opts = opts || {};
    const rx = r * iso.hw, ry = r * iso.hh;
    const sx = iso.x(cx, cy);
    const yTop = iso.y(cx, cy, z + h);
    const yBot = iso.y(cx, cy, z);
    const line = opts.outline === false ? null : Color.shade(color, -0.6);

    // body: left/right silhouette + bottom arc
    ctx.beginPath();
    ctx.moveTo(sx - rx, yTop);
    ctx.lineTo(sx - rx, yBot);
    ctx.ellipse(sx, yBot, rx, ry, 0, Math.PI, 0, true);
    ctx.lineTo(sx + rx, yTop);
    ctx.ellipse(sx, yTop, rx, ry, 0, 0, Math.PI, false);
    ctx.closePath();
    const g = ctx.createLinearGradient(sx - rx, 0, sx + rx, 0);
    g.addColorStop(0, Color.shade(color, -0.30));
    g.addColorStop(0.42, Color.shade(color, 0.04));
    g.addColorStop(1, Color.shade(color, -0.42));
    ctx.fillStyle = g; ctx.fill();
    if (line) { ctx.strokeStyle = line; ctx.lineWidth = opts.lineWidth || 1; ctx.stroke(); }

    // top cap
    ctx.beginPath();
    ctx.ellipse(sx, yTop, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = opts.cap || Color.shade(color, FACE.top + 0.06);
    ctx.fill();
    if (line) ctx.stroke();
  }

  /**
   * Soft contact shadow on the ground plane. Two stacked diamonds fake a
   * penumbra far cheaper than ctx.filter blur.
   */
  function shadow(ctx, iso, x, y, w, d, strength) {
    const s = strength == null ? 0.30 : strength;
    const cx = x + w / 2, cy = y + d / 2;
    const grow = 0.28;
    ctx.save();
    ctx.fillStyle = `rgba(0,0,0,${s * 0.42})`;
    tracePoly(ctx, iso, [
      [cx - w / 2 - grow, cy, 0], [cx, cy - d / 2 - grow, 0],
      [cx + w / 2 + grow, cy, 0], [cx, cy + d / 2 + grow, 0]
    ]); ctx.fill();
    ctx.fillStyle = `rgba(0,0,0,${s})`;
    tracePoly(ctx, iso, [
      [cx - w / 2, cy, 0], [cx, cy - d / 2, 0],
      [cx + w / 2, cy, 0], [cx, cy + d / 2, 0]
    ]); ctx.fill();
    ctx.restore();
  }

  /** Additive glow blob in world-screen space — lamps, sparks, embers. */
  function glow(ctx, iso, gx, gy, gz, radius, color, intensity) {
    const X = iso.x(gx, gy), Y = iso.y(gx, gy, gz);
    const g = ctx.createRadialGradient(X, Y, 0, X, Y, radius);
    g.addColorStop(0, Color.alpha(color, 0.85 * (intensity == null ? 1 : intensity)));
    g.addColorStop(0.45, Color.alpha(color, 0.22 * (intensity == null ? 1 : intensity)));
    g.addColorStop(1, Color.alpha(color, 0));
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath(); ctx.arc(X, Y, radius, 0, Math.PI * 2);
    ctx.fillStyle = g; ctx.fill();
    ctx.restore();
  }

  /**
   * A thick capsule between two GRID points — the building block of the
   * robot arm links. Drawn as an outlined stroke plus a specular streak so
   * segments read as tubular metal rather than flat lines.
   */
  function limb(ctx, iso, a, b, width, color, opts) {
    opts = opts || {};
    const x1 = iso.x(a[0], a[1]), y1 = iso.y(a[0], a[1], a[2]);
    const x2 = iso.x(b[0], b[1]), y2 = iso.y(b[0], b[1], b[2]);

    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // outline
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.lineWidth = width + 2.5;
    ctx.strokeStyle = Color.shade(color, -0.66);
    ctx.stroke();

    // core
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.lineWidth = width;
    ctx.strokeStyle = color;
    ctx.stroke();

    // specular streak, offset toward the light (up-left)
    if (opts.spec !== false) {
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;      // unit normal
      const off = width * 0.24 * (nx < 0 ? 1 : -1);
      ctx.beginPath();
      ctx.moveTo(x1 + nx * off, y1 + ny * off);
      ctx.lineTo(x2 + nx * off, y2 + ny * off);
      ctx.lineWidth = Math.max(1, width * 0.26);
      ctx.strokeStyle = Color.shade(color, 0.34);
      ctx.stroke();
    }

    // shaded underside
    if (opts.shade !== false) {
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      const off = width * 0.30 * (nx < 0 ? -1 : 1);
      ctx.beginPath();
      ctx.moveTo(x1 + nx * off, y1 + ny * off);
      ctx.lineTo(x2 + nx * off, y2 + ny * off);
      ctx.lineWidth = Math.max(1, width * 0.20);
      ctx.strokeStyle = Color.alpha('#000000', 0.28);
      ctx.stroke();
    }
  }

  /** Joint puck at a grid point — the dark pivot discs between limbs. */
  function joint(ctx, iso, p, r, color) {
    const X = iso.x(p[0], p[1]), Y = iso.y(p[0], p[1], p[2]);
    ctx.beginPath(); ctx.arc(X, Y, r, 0, Math.PI * 2);
    ctx.fillStyle = color || '#22262c'; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.stroke();
    ctx.beginPath(); ctx.arc(X - r * 0.28, Y - r * 0.32, r * 0.34, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fill();
  }

  /** Text label pinned to a grid point (debug / signage). */
  function label(ctx, iso, gx, gy, gz, text, opts) {
    opts = opts || {};
    const X = iso.x(gx, gy), Y = iso.y(gx, gy, gz);
    ctx.save();
    ctx.font = opts.font || '600 9px "JetBrains Mono", ui-monospace, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (opts.bg) {
      const w = ctx.measureText(text).width + 10;
      ctx.fillStyle = opts.bg;
      ctx.beginPath();
      // roundRect is recent (Safari 16 / FF 112); fall back to a plain box
      const drawBox = typeof ctx.roundRect === 'function' ? ctx.roundRect.bind(ctx) : ctx.rect.bind(ctx);
      drawBox(X - w / 2, Y - 8, w, 16, 4);
      ctx.fill();
    }
    ctx.fillStyle = opts.color || 'rgba(214,226,240,.8)';
    ctx.fillText(text, X, Y);
    ctx.restore();
  }

  /* ------------------------------------------------------------------ */
  /*  Camera — pan, zoom, auto-fit                                       */
  /* ------------------------------------------------------------------ */
  class Camera {
    constructor() {
      this.x = 0; this.y = 0;          // applied screen-space translation
      this.zoom = 1;                   // applied zoom
      this.fitZoom = 1;                // zoom that makes the world fit
      this.userZoom = 1;               // player multiplier on top of fit
      this.minUser = 0.45; this.maxUser = 2.8;
      this.tx = 0; this.ty = 0;        // smoothing targets
      this.tZoom = 1;
      this.panX = 0; this.panY = 0;    // player pan, survives a resize
      this._vw = 1; this._vh = 1; this._cx = 0; this._cy = 0;
    }

    /**
     * Recompute fit zoom + centring for the current viewport.
     * `wb` is the world screen-space bounding box in unzoomed pixels.
     * Any pan/zoom the player applied is preserved across the refit.
     */
    fit(viewW, viewH, wb, pad) {
      const p = pad == null ? 0.90 : pad;
      const ww = (wb.maxX - wb.minX) || 1;
      const wh = (wb.maxY - wb.minY) || 1;
      this._vw = viewW; this._vh = viewH;
      this._cx = (wb.minX + wb.maxX) / 2;
      this._cy = (wb.minY + wb.maxY) / 2;
      this.fitZoom = Math.min(viewW / ww, viewH / wh) * p;
      this._recenter();
    }

    _recenter() {
      this.tZoom = this.fitZoom * this.userZoom;
      this.tx = this._vw / 2 - this._cx * this.tZoom + this.panX;
      this.ty = this._vh / 2 - this._cy * this.tZoom + this.panY;
    }

    /** Zoom around a screen anchor so the point under the cursor stays put. */
    zoomAt(screenX, screenY, factor) {
      const before = this.tZoom;
      this.userZoom = M.clamp(this.userZoom * factor, this.minUser, this.maxUser);
      this.tZoom = this.fitZoom * this.userZoom;
      const k = this.tZoom / before;
      const nx = screenX - (screenX - this.tx) * k;
      const ny = screenY - (screenY - this.ty) * k;
      // fold the anchor correction back into the persistent pan offset
      this.panX = nx - (this._vw / 2 - this._cx * this.tZoom);
      this.panY = ny - (this._vh / 2 - this._cy * this.tZoom);
      this.tx = nx; this.ty = ny;
    }

    pan(dx, dy) {
      this.panX += dx; this.panY += dy;
      this.tx += dx; this.ty += dy;
      this.x += dx; this.y += dy;      // 1:1 with the pointer, no lag
    }

    /** Back to the auto-fitted framing. */
    reset() { this.panX = 0; this.panY = 0; this.userZoom = 1; this._recenter(); }

    update(dt) {
      this.x = M.damp(this.x, this.tx, 14, dt);
      this.y = M.damp(this.y, this.ty, 14, dt);
      this.zoom = M.damp(this.zoom, this.tZoom, 14, dt);
    }

    snap() { this.x = this.tx; this.y = this.ty; this.zoom = this.tZoom; }

    /** Canvas CSS px → world-space screen px. */
    toWorld(sx, sy) {
      return { x: (sx - this.x) / this.zoom, y: (sy - this.y) / this.zoom };
    }
  }

  /* ------------------------------------------------------------------ */
  global.ISO = {
    M, Color, Iso, Camera, FACE,
    draw: {
      tracePoly, fillPoly, diamond, box, cylinder,
      shadow, glow, limb, joint, label
    }
  };
})(window);

/* ===== js/entities.js ================================================ */
/* =====================================================================
   entities.js — every procedural prop in the factory.
   ---------------------------------------------------------------------
   Contract for the renderer:
     update(dt, time)   advance animation state (dt in seconds)
     collect(rl)        push draw commands: rl.add(depthKey, (ctx, iso) => {})

   Entities emit MANY commands (a conveyor emits one per tile, plus one per
   item) so the painter sort interleaves them correctly with everything
   standing around them.

   Nothing here knows about money, rates, or upgrades — Step 2 drives these
   objects purely through their public fields (speed, active, colour, and
   the spawn/dock hooks flagged with «STEP-2 HOOK»).
   ===================================================================== */
(function (global) {
  'use strict';

  const { M, Color, draw } = global.ISO;
  const D = draw;

  let __uid = 0;

  /* =================================================================== */
  /*  Base                                                               */
  /* =================================================================== */
  class Entity {
    constructor(o) {
      this.id = 'e' + (++__uid);
      this.x = 0; this.y = 0; this.z = 0;
      this.active = true;
      this.tag = 'entity';
      Object.assign(this, o || {});
      this.age = 0;
    }
    update(dt) { this.age += dt; }
    collect() { }
  }

  /* =================================================================== */
  /*  Ground — floor plate, road, dock apron, grid, hover tile           */
  /*  Drawn as a single command underneath everything else.              */
  /* =================================================================== */
  class Ground extends Entity {
    constructor(o) {
      super(Object.assign({ tag: 'ground', w: 24, d: 24, road: null, marks: [] }, o));
      this.showGrid = true;
      this.hover = null;          // {gx, gy} set by the engine on mousemove
      this.palette = {
        a: '#1d242e', b: '#212a35', edge: '#2c3947',
        rim: '#151b23', road: '#191d23', paint: '#e0c85a'
      };
    }

    collect(rl) {
      rl.add(-1e12, (ctx, iso) => {
        const W = this.w, Dp = this.d, P = this.palette;

        // --- slab side walls, so the plate reads as a solid block -----
        D.box(ctx, iso, {
          x: 0, y: 0, z: -0.6, w: W, d: Dp, h: 0.6,
          color: P.rim, top: P.a, outline: '#0d1218'
        });

        // --- tiles ---------------------------------------------------
        for (let gx = 0; gx < W; gx++) {
          for (let gy = 0; gy < Dp; gy++) {
            const n = M.hash(gx * 3.1, gy * 7.7);
            const base = ((gx + gy) & 1) ? P.a : P.b;
            D.diamond(ctx, iso, gx, gy, 0, 1, 1,
              Color.shade(base, (n - 0.5) * 0.09), null, 0);
          }
        }

        // --- painted floor markings ----------------------------------
        ctx.save();
        ctx.globalAlpha = 0.14;
        for (const m of (this.marks || [])) {
          D.diamond(ctx, iso, m.x, m.y, 0.002, m.w, m.d, m.color || '#ffc832');
        }
        ctx.restore();

        // --- grid ----------------------------------------------------
        if (this.showGrid) {
          ctx.save();
          ctx.strokeStyle = 'rgba(130,175,220,.075)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (let i = 0; i <= W; i++) {
            ctx.moveTo(iso.x(i, 0), iso.y(i, 0));
            ctx.lineTo(iso.x(i, Dp), iso.y(i, Dp));
          }
          for (let j = 0; j <= Dp; j++) {
            ctx.moveTo(iso.x(0, j), iso.y(0, j));
            ctx.lineTo(iso.x(W, j), iso.y(W, j));
          }
          ctx.stroke();
          ctx.restore();
        }

        // --- road / truck lane ---------------------------------------
        if (this.road) {
          const r = this.road;
          D.diamond(ctx, iso, r.x0, r.y, 0.004, r.x1 - r.x0, r.d, P.road);
          // kerbs
          D.diamond(ctx, iso, r.x0, r.y - 0.12, 0.005, r.x1 - r.x0, 0.12, '#2a323d');
          D.diamond(ctx, iso, r.x0, r.y + r.d, 0.005, r.x1 - r.x0, 0.12, '#2a323d');
          // centre dashes
          ctx.save(); ctx.globalAlpha = 0.5;
          for (let s = r.x0 + 0.4; s < r.x1; s += 1.6) {
            D.diamond(ctx, iso, s, r.y + r.d / 2 - 0.05, 0.006, 0.8, 0.1, P.paint);
          }
          ctx.restore();
        }

        // --- outer rim highlight -------------------------------------
        D.fillPoly(ctx, iso, [
          [0, 0, 0], [W, 0, 0], [W, Dp, 0], [0, Dp, 0]
        ], null, 'rgba(150,200,255,.14)', 1.5);

        // --- hover highlight -----------------------------------------
        if (this.hover) {
          const h = this.hover, pulse = 0.35 + 0.2 * Math.sin(this.age * 5);
          D.diamond(ctx, iso, h.gx, h.gy, 0.01, 1, 1,
            `rgba(255,200,50,${0.10 + pulse * 0.10})`,
            `rgba(255,200,50,${0.5 + pulse * 0.3})`, 1.5);
        }
      });
    }
  }

  /* =================================================================== */
  /*  Conveyor — animated belt carrying items                            */
  /* =================================================================== */
  const ITEM_KINDS = [
    { color: '#c98f4b', size: 0.34, name: 'crate' },
    { color: '#5aa9e6', size: 0.30, name: 'part' },
    { color: '#8ad07a', size: 0.28, name: 'cell' },
    { color: '#d46f6f', size: 0.32, name: 'alloy' }
  ];

  class Conveyor extends Entity {
    /**
     * @param {object} o  {x, y, len, dir:'+x'|'-x'|'+y'|'-y', speed, width}
     */
    constructor(o) {
      super(Object.assign({
        tag: 'conveyor', len: 6, dir: '+x', speed: 1.1, width: 0.72,
        color: '#39424e', beltColor: '#15191f', railColor: '#4a5563',
        height: 0.34, autoSpawn: true, spacing: 1.0,
        /** Payload appearance pool; null = the default mixed crates. */
        kinds: null,
        /** «STEP-2 HOOK» called with the item when it runs off the end. */
        onDeliver: null
      }, o));

      const dirs = { '+x': [1, 0], '-x': [-1, 0], '+y': [0, 1], '-y': [0, -1] };
      const a = dirs[this.dir] || dirs['+x'];
      this.ax = a[0]; this.ay = a[1];
      this.px = -this.ay; this.py = this.ax;   // perpendicular (grid space)

      this.scroll = 0;
      this.items = [];
      if (this.autoSpawn) {
        for (let s = 0; s < this.len; s += this.spacing) {
          this.items.push(this._makeItem(s));
        }
      }
    }

    _pool() { return (this.kinds && this.kinds.length) ? this.kinds : ITEM_KINDS; }

    _makeItem(s, kind) {
      const pool = this._pool();
      const k = kind || pool[(Math.random() * pool.length) | 0];
      return { s, kind: k, spin: Math.random() * Math.PI, wobble: Math.random() * 6.28 };
    }

    /** Swap the payload appearance — existing items re-roll in place. */
    setKinds(kinds) {
      this.kinds = kinds;
      const pool = this._pool();
      for (const it of this.items) it.kind = pool[(Math.random() * pool.length) | 0];
    }

    /** Re-space the payload; only rebuilds when the gap really changed. */
    setSpacing(spacing) {
      const s = Math.max(0.25, spacing);
      if (Math.abs(s - this.spacing) < 0.05) return;
      this.spacing = s;
      if (!this.autoSpawn) return;
      const phase = this.items.length ? this.items[0].s % s : 0;
      this.items.length = 0;
      for (let t = phase; t < this.len; t += s) this.items.push(this._makeItem(t));
    }

    /** «STEP-2 HOOK» push a specific payload onto the tail of the belt. */
    spawnItem(kind) { this.items.push(this._makeItem(0, kind)); }

    /** Grid point at belt coordinate (s along, u across, z up). */
    point(s, u, z) {
      return [
        this.x + this.ax * s + this.px * u,
        this.y + this.ay * s + this.py * u,
        (z == null ? this.height : z)
      ];
    }

    /** Axis-aligned footprint for the (s,u) rectangle — boxes need x/y/w/d. */
    _rect(s0, s1, u0, u1) {
      const ax = this.ax, ay = this.ay, px = this.px, py = this.py;
      const c1x = this.x + ax * s0 + px * u0, c1y = this.y + ay * s0 + py * u0;
      const c2x = this.x + ax * s1 + px * u1, c2y = this.y + ay * s1 + py * u1;
      return {
        x: Math.min(c1x, c2x), y: Math.min(c1y, c2y),
        w: Math.abs(c2x - c1x), d: Math.abs(c2y - c1y)
      };
    }

    update(dt) {
      super.update(dt);
      if (!this.active) return;
      this.scroll = M.mod(this.scroll + this.speed * dt, 0.5);
      const v = this.speed * dt;
      for (let i = this.items.length - 1; i >= 0; i--) {
        const it = this.items[i];
        it.s += v;
        if (it.s > this.len) {
          if (this.onDeliver) this.onDeliver(it);
          if (this.autoSpawn) { it.s -= this.len; it.kind = ITEM_KINDS[(Math.random() * 4) | 0]; }
          else this.items.splice(i, 1);
        }
      }
    }

    collect(rl) {
      const H = this.height, hw = this.width / 2;

      // ---- structure, one command per tile so props interleave -------
      for (let i = 0; i < this.len; i++) {
        const s0 = i, s1 = i + 1;
        const mid = this.point(i + 0.5, 0, 0);
        rl.add(rl.iso.depth(mid[0], mid[1], 0, 1), (ctx, iso) => {
          // contact shadow
          const sh = this._rect(s0, s1, -hw - 0.08, hw + 0.08);
          D.shadow(ctx, iso, sh.x, sh.y, sh.w, sh.d, 0.26);

          // support legs every other tile
          if (i % 2 === 0) {
            for (const u of [-hw + 0.08, hw - 0.16]) {
              const lr = this._rect(s0 + 0.35, s0 + 0.5, u, u + 0.1);
              D.box(ctx, iso, {
                x: lr.x, y: lr.y, z: 0, w: Math.max(lr.w, 0.1), d: Math.max(lr.d, 0.1),
                h: H - 0.06, color: '#2b333d'
              });
            }
          }

          // deck / chassis
          const deck = this._rect(s0, s1, -hw, hw);
          D.box(ctx, iso, {
            x: deck.x, y: deck.y, z: H - 0.1, w: deck.w, d: deck.d, h: 0.1,
            color: this.color, outline: '#151a20'
          });

          // belt surface
          const belt = this._rect(s0, s1, -hw + 0.07, hw - 0.07);
          D.diamond(ctx, iso, belt.x, belt.y, H + 0.001,
            belt.w, belt.d, this.beltColor);

          // moving treads — chevrons crossing the belt every 0.25u
          ctx.save();
          ctx.strokeStyle = this.active ? 'rgba(180,205,235,.30)' : 'rgba(120,130,145,.15)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          const step = 0.25;
          const off = M.mod(this.scroll, step);
          for (let t = s0 - off; t < s1; t += step) {
            if (t < s0 - 1e-6) continue;
            const a = this.point(t, -hw + 0.07, H + 0.002);
            const b = this.point(t, hw - 0.07, H + 0.002);
            ctx.moveTo(iso.x(a[0], a[1]), iso.y(a[0], a[1], a[2]));
            ctx.lineTo(iso.x(b[0], b[1]), iso.y(b[0], b[1], b[2]));
          }
          ctx.stroke();
          ctx.restore();

          // side rails
          for (const u of [-hw, hw - 0.06]) {
            const r = this._rect(s0, s1, u, u + 0.06);
            D.box(ctx, iso, {
              x: r.x, y: r.y, z: H, w: Math.max(r.w, 0.06), d: Math.max(r.d, 0.06),
              h: 0.1, color: this.railColor, outline: '#171c22'
            });
          }

          // running light strip on the outer rail
          if (this.active) {
            const on = M.mod(i * 0.5 - this.scroll * 2, 3) < 1;
            if (on) {
              const p = this.point(i + 0.5, hw + 0.02, H + 0.12);
              D.glow(ctx, iso, p[0], p[1], p[2], 9, '#ffc832', 0.5);
            }
          }
        });
      }

      // ---- payload items --------------------------------------------
      for (const it of this.items) {
        const p = this.point(it.s, 0, H + 0.02);
        rl.add(rl.iso.depth(p[0], p[1], p[2], 3), (ctx, iso) => {
          const k = it.kind, sz = k.size;
          const bob = Math.sin(this.age * 9 + it.wobble) * 0.012 * (this.active ? 1 : 0);
          D.shadow(ctx, iso, p[0] - sz / 2, p[1] - sz / 2, sz, sz, 0.18);
          D.box(ctx, iso, {
            x: p[0] - sz / 2, y: p[1] - sz / 2, z: p[2] + bob,
            w: sz, d: sz, h: sz * 0.78, color: k.color
          });
          // strap detail
          const strap = Color.shade(k.color, -0.45);
          D.diamond(ctx, iso, p[0] - sz / 2, p[1] - 0.03,
            p[2] + bob + sz * 0.78 + 0.001, sz, 0.06, strap);
        });
      }
    }
  }

  /* =================================================================== */
  /*  RobotArm — yellow articulated 3-link manipulator with real IK      */
  /* =================================================================== */
  class RobotArm extends Entity {
    /**
     * @param {object} o {x, y, pick:[gx,gy,gz], place:[gx,gy,gz], color, cycle}
     */
    constructor(o) {
      super(Object.assign({
        tag: 'arm',
        color: '#f2c025', dark: '#23282f', accent: '#2b3038',
        L1: 1.25, L2: 1.05,        // upper arm / forearm length (grid units)
        baseH: 0.45,               // pedestal height
        cycle: 3.4,                // seconds per full pick-and-place
        phase: 0,                  // stagger identical arms
        pick: [1, 0, 0.6],
        place: [-1, 0, 0.6],
        payloadColor: '#c98f4b',
        /** «STEP-2 HOOK» fires when the arm releases at the place point. */
        onPlace: null
      }, o));

      this.t = this.phase % 1;
      this.grip = 0;               // 0 = open, 1 = closed
      this.holding = null;         // {color, size}
      this.yaw = 0;
      this.effector = [this.x, this.y, this.baseH];
      this.spark = 0;

      // Key poses, expressed as fractions of the cycle. The effector is
      // eased between them; `g` is the gripper state at that pose.
      const lift = 0.55;
      this.keys = [
        { p: [this.pick[0], this.pick[1], this.pick[2] + lift], t: 0.00, g: 0 },
        { p: this.pick, t: 0.14, g: 0 },
        { p: this.pick, t: 0.22, g: 1 },   // close on the item
        { p: [this.pick[0], this.pick[1], this.pick[2] + lift], t: 0.34, g: 1 },
        { p: [this.place[0], this.place[1], this.place[2] + lift], t: 0.58, g: 1 },
        { p: this.place, t: 0.70, g: 1 },
        { p: this.place, t: 0.78, g: 0 },  // release
        { p: [this.place[0], this.place[1], this.place[2] + lift], t: 0.88, g: 0 },
        { p: [this.pick[0], this.pick[1], this.pick[2] + lift], t: 1.00, g: 0 }
      ];
    }

    /** 2-link planar IK solved in the vertical plane containing the yaw. */
    _solve(reach, height) {
      const L1 = this.L1, L2 = this.L2;
      let d = Math.hypot(reach, height);
      d = M.clamp(d, Math.abs(L1 - L2) + 0.02, L1 + L2 - 0.02);
      const a = Math.atan2(height, reach);
      const cosB = M.clamp((d * d + L1 * L1 - L2 * L2) / (2 * d * L1), -1, 1);
      const shoulder = a + Math.acos(cosB);          // elbow-up solution
      return {
        shoulder,
        elbowR: Math.cos(shoulder) * L1,
        elbowZ: Math.sin(shoulder) * L1,
        // recompute the reachable tip so the render never "detaches"
        tipR: reach * (d / (Math.hypot(reach, height) || 1)),
        tipZ: height * (d / (Math.hypot(reach, height) || 1))
      };
    }

    update(dt) {
      super.update(dt);
      if (this.active) this.t = M.mod(this.t + dt / this.cycle, 1);

      // --- sample the keyframe track -------------------------------
      const K = this.keys;
      let i = 0;
      while (i < K.length - 1 && this.t > K[i + 1].t) i++;
      const a = K[i], b = K[Math.min(i + 1, K.length - 1)];
      const span = Math.max(b.t - a.t, 1e-4);
      const k = M.easeInOut(M.clamp((this.t - a.t) / span, 0, 1));

      const tx = M.lerp(a.p[0], b.p[0], k);
      const ty = M.lerp(a.p[1], b.p[1], k);
      const tz = M.lerp(a.p[2], b.p[2], k);
      const wantGrip = M.lerp(a.g, b.g, k);

      // pick-up / release edges
      const wasHolding = !!this.holding;
      this.grip = M.damp(this.grip, wantGrip, 22, dt);
      if (!wasHolding && wantGrip > 0.5) {
        this.holding = { color: this.payloadColor, size: 0.32 };
        this.spark = 1;
      } else if (wasHolding && wantGrip < 0.5) {
        this.holding = null;
        if (this.onPlace) this.onPlace(this);
      }
      this.spark = Math.max(0, this.spark - dt * 3);

      // --- smooth the effector, then resolve the joint chain --------
      this.effector[0] = M.damp(this.effector[0], tx, 26, dt);
      this.effector[1] = M.damp(this.effector[1], ty, 26, dt);
      this.effector[2] = M.damp(this.effector[2], tz, 26, dt);

      const dx = this.effector[0] - this.x;
      const dy = this.effector[1] - this.y;
      const targetYaw = Math.atan2(dy, dx);
      // shortest-path yaw interpolation
      let delta = M.mod(targetYaw - this.yaw + Math.PI, Math.PI * 2) - Math.PI;
      this.yaw += delta * (1 - Math.exp(-16 * dt));

      const reach = Math.hypot(dx, dy);
      const height = this.effector[2] - (this.z + this.baseH + 0.35);
      this.ik = this._solve(reach, height);
    }

    collect(rl) {
      const depth = rl.iso.depth(this.x, this.y, 0, 6);
      rl.add(depth, (ctx, iso) => {
        const c = this.color, dark = this.dark;
        const cy = Math.cos(this.yaw), sy = Math.sin(this.yaw);
        const bz = this.z + this.baseH;
        const shoulderZ = bz + 0.35;

        // world point at (radial r, height z) in the arm's working plane
        const P = (r, zz) => [this.x + cy * r, this.y + sy * r, zz];

        D.shadow(ctx, iso, this.x - 0.55, this.y - 0.55, 1.1, 1.1, 0.34);

        // ---- bolted floor plate + pedestal -------------------------
        D.box(ctx, iso, {
          x: this.x - 0.52, y: this.y - 0.52, z: this.z, w: 1.04, d: 1.04,
          h: 0.1, color: '#39404a'
        });
        for (const [ox, oy] of [[-0.42, -0.42], [0.32, -0.42], [-0.42, 0.32], [0.32, 0.32]]) {
          D.box(ctx, iso, {
            x: this.x + ox, y: this.y + oy, z: this.z + 0.1, w: 0.1, d: 0.1,
            h: 0.05, color: '#20252b', outline: false
          });
        }
        D.cylinder(ctx, iso, this.x, this.y, this.z + 0.1, 0.38,
          this.baseH - 0.1, dark);

        // ---- rotating turret (yellow) ------------------------------
        D.cylinder(ctx, iso, this.x, this.y, bz, 0.34, 0.3, c, { cap: Color.shade(c, 0.2) });
        // yaw indicator notch on the turret cap
        const nA = P(0.30, bz + 0.31), nB = P(0.16, bz + 0.31);
        D.limb(ctx, iso, nA, nB, 4, Color.shade(c, -0.4), { spec: false, shade: false });
        // counterweight, opposite the reach direction
        const cwA = P(-0.05, shoulderZ), cwB = P(-0.46, shoulderZ - 0.05);
        D.limb(ctx, iso, cwA, cwB, 13, dark, { spec: false });

        const ik = this.ik || { elbowR: 0.6, elbowZ: 0.6, tipR: 1, tipZ: 0.4 };
        const shoulder = P(0, shoulderZ);
        const elbow = P(ik.elbowR, shoulderZ + ik.elbowZ);
        const wrist = [this.effector[0], this.effector[1], this.effector[2] + 0.24];
        const tip = [this.effector[0], this.effector[1], this.effector[2]];

        // ---- links --------------------------------------------------
        D.limb(ctx, iso, shoulder, elbow, 13, c);              // upper arm
        D.joint(ctx, iso, shoulder, 7.5, dark);
        D.limb(ctx, iso, elbow, wrist, 10, c);                 // forearm
        D.joint(ctx, iso, elbow, 6, dark);
        // hydraulic strut running alongside the upper arm
        const strutA = P(ik.elbowR * 0.18, shoulderZ - 0.12);
        D.limb(ctx, iso, strutA, [
          M.lerp(elbow[0], wrist[0], 0.15),
          M.lerp(elbow[1], wrist[1], 0.15),
          M.lerp(elbow[2], wrist[2], 0.15)
        ], 4, '#8d949c', { spec: false });

        // ---- wrist + gripper ---------------------------------------
        D.joint(ctx, iso, wrist, 5, dark);
        const spread = M.lerp(0.19, 0.085, this.grip);
        const fx = -sy, fy = cy;                  // finger spread axis
        for (const s of [-1, 1]) {
          const knuckle = [wrist[0] + fx * spread * s, wrist[1] + fy * spread * s, wrist[2] - 0.1];
          const fingerT = [wrist[0] + fx * spread * s * 0.8, wrist[1] + fy * spread * s * 0.8, tip[2] - 0.02];
          D.limb(ctx, iso, wrist, knuckle, 6, Color.shade(c, -0.12), { spec: false });
          D.limb(ctx, iso, knuckle, fingerT, 5, dark, { spec: false });
        }

        // ---- payload ------------------------------------------------
        if (this.holding) {
          const sz = this.holding.size;
          D.box(ctx, iso, {
            x: tip[0] - sz / 2, y: tip[1] - sz / 2, z: tip[2] - sz * 0.5,
            w: sz, d: sz, h: sz * 0.8, color: this.holding.color
          });
        }
        if (this.spark > 0.01) {
          D.glow(ctx, iso, tip[0], tip[1], tip[2], 16 * this.spark, '#fff0a8', this.spark * 0.8);
        }

        // ---- status beacon on the turret ---------------------------
        const blink = this.active ? (0.55 + 0.45 * Math.sin(this.age * 6)) : 0.15;
        const bp = P(0, bz + 0.42);
        D.glow(ctx, iso, bp[0], bp[1], bp[2], 8, this.active ? '#7dffb0' : '#ff5f56', blink);
      });
    }
  }

  /* =================================================================== */
  /*  Truck — arrives at a dock, waits, departs, loops                   */
  /* =================================================================== */
  class Truck extends Entity {
    /**
     * @param {object} o {laneY, dockX, dir:+1|-1, color, spawnX, exitX, wait}
     */
    constructor(o) {
      super(Object.assign({
        tag: 'truck',
        laneY: 20, dockX: 8, dir: 1,
        spawnX: -7, exitX: 32,
        color: '#2f6fd0', trailer: '#c9d2dc',
        wait: 4.2, speed: 5.2, width: 1.6, length: 4.4,
        delay: 0,
        /** Optional gate: return false to hold the truck off the road. */
        canStart: null,
        /** «STEP-2 HOOK» the moment the truck settles against the dock. */
        onArrive: null,
        /** «STEP-2 HOOK» when it pulls away loaded. */
        onDepart: null
      }, o));

      this.state = 'idle';
      this.timer = this.delay;
      this.px = this.spawnX;      // position along the lane
      this.bob = 0;
      this.brake = 0;
    }

    update(dt) {
      super.update(dt);
      this.timer -= dt;

      switch (this.state) {
        case 'idle':
          this.px = this.spawnX;
          // canStart lets the world gate the lane (one rig at a time)
          if (this.timer <= 0 && (!this.canStart || this.canStart(this))) {
            this.state = 'inbound';
          }
          break;

        case 'inbound': {
          const remain = (this.dockX - this.px) * this.dir;
          // ease down over the last 4 units of approach
          const v = this.speed * M.clamp(remain / 4, 0.14, 1);
          this.brake = M.damp(this.brake, remain < 4 ? 1 : 0, 6, dt);
          this.px += this.dir * v * dt;
          if (remain <= 0.02) {
            this.px = this.dockX;
            this.state = 'docked';
            this.timer = this.wait;
            if (this.onArrive) this.onArrive(this);
          }
          break;
        }

        case 'docked':
          this.brake = M.damp(this.brake, 1, 5, dt);
          if (this.timer <= 0) {
            this.state = 'outbound';
            this.brake = 0;
            if (this.onDepart) this.onDepart(this);
          }
          break;

        case 'outbound': {
          const travelled = Math.abs(this.px - this.dockX);
          const v = this.speed * M.clamp(0.18 + travelled / 5, 0.18, 1);
          this.px += this.dir * v * dt;
          if ((this.dir > 0 && this.px > this.exitX) ||
            (this.dir < 0 && this.px < this.exitX)) {
            this.state = 'idle';
            this.timer = 2 + Math.random() * 3;
          }
          break;
        }
      }

      const moving = this.state === 'inbound' || this.state === 'outbound';
      this.bob = moving ? Math.sin(this.age * 22) * 0.012 : M.damp(this.bob, 0, 8, dt);
      this.moving = moving;
    }

    collect(rl) {
      if (this.state === 'idle') return;

      const cxg = this.px, cyg = this.laneY;
      rl.add(rl.iso.depth(cxg, cyg + this.width / 2, 0, 5), (ctx, iso) => {
        const dir = this.dir;
        const L = this.length, W = this.width;
        const y0 = cyg - W / 2;
        const z = 0.30 + this.bob;                 // chassis height
        const front = dir > 0 ? cxg + L / 2 : cxg - L / 2;
        const cabL = 1.35;

        D.shadow(ctx, iso, cxg - L / 2, y0 - 0.05, L, W + 0.1, 0.38);

        // ---- wheels --------------------------------------------------
        const axles = [front - dir * 0.55, front - dir * 2.6, front - dir * 3.3];
        for (const ax of axles) {
          for (const wy of [y0 + 0.02, y0 + W - 0.24]) {
            D.box(ctx, iso, {
              x: ax - 0.22, y: wy, z: 0.02 + this.bob, w: 0.44, d: 0.22,
              h: 0.3, color: '#14181d', top: '#2a3037'
            });
          }
        }

        // ---- trailer -------------------------------------------------
        const tRear = dir > 0 ? cxg - L / 2 : cxg + L / 2;
        const tx = Math.min(tRear, front - dir * cabL);
        const tw = L - cabL;
        D.box(ctx, iso, {
          x: tx, y: y0, z: z, w: tw, d: W, h: 1.15,
          color: this.trailer, outline: '#5c6672'
        });
        // livery stripe
        D.box(ctx, iso, {
          x: tx, y: y0 - 0.001, z: z + 0.52, w: tw, d: W + 0.002, h: 0.16,
          color: this.color, outline: false
        });
        // rear door seams
        const rearX = dir > 0 ? tx : tx + tw;
        ctx.save(); ctx.globalAlpha = 0.5;
        D.box(ctx, iso, {
          x: rearX - (dir > 0 ? 0.02 : 0), y: y0, z: z, w: 0.02, d: W, h: 1.15,
          color: '#7c848e', outline: false
        });
        ctx.restore();
        // roof rib detail
        for (let r = 0.3; r < tw - 0.2; r += 0.55) {
          D.diamond(ctx, iso, tx + r, y0, z + 1.151, 0.06, W, Color.shade(this.trailer, -0.16));
        }

        // ---- cab -----------------------------------------------------
        const cx0 = dir > 0 ? front - cabL : front;
        D.box(ctx, iso, {
          x: cx0, y: y0, z: z, w: cabL, d: W, h: 0.95, color: this.color
        });
        // windshield on the leading face
        const wx = dir > 0 ? cx0 + cabL - 0.02 : cx0 + 0.02;
        D.fillPoly(ctx, iso, [
          [wx, y0 + 0.12, z + 0.9], [wx, y0 + W - 0.12, z + 0.9],
          [wx, y0 + W - 0.12, z + 0.46], [wx, y0 + 0.12, z + 0.46]
        ], 'rgba(150,205,235,.55)', 'rgba(20,26,32,.7)', 1);
        // exhaust stack behind the cab
        D.cylinder(ctx, iso, dir > 0 ? cx0 - 0.06 : cx0 + cabL + 0.06,
          y0 + 0.12, z + 0.95, 0.07, 0.55, '#3a4149');

        // ---- lamps ---------------------------------------------------
        const lampZ = z + 0.34;
        if (this.moving) {
          for (const ly of [y0 + 0.25, y0 + W - 0.25]) {
            D.glow(ctx, iso, wx, ly, lampZ, 13, '#fff3c4', 0.9);
          }
        }
        if (this.brake > 0.05) {
          const bx = dir > 0 ? tx : tx + tw;
          for (const ly of [y0 + 0.28, y0 + W - 0.28]) {
            D.glow(ctx, iso, bx, ly, z + 0.3, 12, '#ff4b3e', this.brake);
          }
        }
        // roof marker lamps
        ctx.save(); ctx.globalAlpha = 0.7;
        for (let i = 0; i < 3; i++) {
          const mx = cx0 + cabL * (0.25 + i * 0.25);
          D.glow(ctx, iso, mx, y0 + W / 2, z + 0.98, 5, '#ffb347', 0.55);
        }
        ctx.restore();
      });
    }
  }

  /* =================================================================== */
  /*  CrateStack — warehouse pallets of boxes                            */
  /* =================================================================== */
  class CrateStack extends Entity {
    constructor(o) {
      super(Object.assign({
        tag: 'crates', cols: 2, rows: 2, levels: 3, seed: 1,
        color: '#b57c3f'
      }, o));
    }

    collect(rl) {
      rl.add(rl.iso.depth(this.x, this.y, 0, 2), (ctx, iso) => {
        const w = this.cols * 0.8, d = this.rows * 0.8;
        D.shadow(ctx, iso, this.x - 0.06, this.y - 0.06, w + 0.12, d + 0.12, 0.34);

        // pallet
        D.box(ctx, iso, {
          x: this.x - 0.05, y: this.y - 0.05, z: 0, w: w + 0.1, d: d + 0.1,
          h: 0.12, color: '#6d5334'
        });

        for (let l = 0; l < this.levels; l++) {
          for (let cx = 0; cx < this.cols; cx++) {
            for (let cy = 0; cy < this.rows; cy++) {
              const n = M.hash(this.seed + cx * 4.1 + l * 9.3, cy * 2.7 + l * 5.5);
              if (l === this.levels - 1 && n > 0.68) continue;    // ragged top
              const jx = (n - 0.5) * 0.05, jy = (M.hash(n * 91, l) - 0.5) * 0.05;
              const col = Color.shade(this.color, (n - 0.5) * 0.22);
              const bx = this.x + cx * 0.8 + jx, by = this.y + cy * 0.8 + jy;
              const bz = 0.12 + l * 0.7;
              D.box(ctx, iso, {
                x: bx, y: by, z: bz, w: 0.74, d: 0.74, h: 0.68, color: col
              });
              // banding
              D.diamond(ctx, iso, bx, by + 0.34, bz + 0.681, 0.74, 0.06,
                'rgba(0,0,0,.28)');
              if (n > 0.55) {
                D.fillPoly(ctx, iso, [
                  [bx + 0.2, by + 0.74, bz + 0.5], [bx + 0.54, by + 0.74, bz + 0.5],
                  [bx + 0.54, by + 0.74, bz + 0.26], [bx + 0.2, by + 0.74, bz + 0.26]
                ], 'rgba(240,232,210,.55)', null, 0);
              }
            }
          }
        }
      });
    }
  }

  /* =================================================================== */
  /*  Generator — machine block, spinning fan, pipes, exhaust puffs      */
  /* =================================================================== */
  class Generator extends Entity {
    constructor(o) {
      super(Object.assign({
        tag: 'generator', w: 2.2, d: 1.6, h: 1.25,
        color: '#4a5563', accent: '#ffc832', rpm: 2.4
      }, o));
      this.fan = 0;
      this.puffs = [];
      this.puffTimer = 0;
    }

    update(dt) {
      super.update(dt);
      if (this.active) this.fan += dt * this.rpm * Math.PI * 2;

      this.puffTimer -= dt;
      if (this.active && this.puffTimer <= 0) {
        this.puffTimer = 0.42 + Math.random() * 0.3;
        this.puffs.push({
          x: this.x + this.w - 0.35, y: this.y + 0.3,
          z: this.h + 0.75, life: 0, max: 2.4,
          r: 5 + Math.random() * 4, drift: (Math.random() - 0.5) * 0.25
        });
      }
      for (let i = this.puffs.length - 1; i >= 0; i--) {
        const p = this.puffs[i];
        p.life += dt;
        p.z += dt * 0.42;
        p.x += p.drift * dt;
        if (p.life > p.max) this.puffs.splice(i, 1);
      }
    }

    collect(rl) {
      rl.add(rl.iso.depth(this.x, this.y, 0, 2), (ctx, iso) => {
        const c = this.color;
        D.shadow(ctx, iso, this.x, this.y, this.w, this.d, 0.36);

        // skid frame
        D.box(ctx, iso, {
          x: this.x - 0.08, y: this.y - 0.08, z: 0, w: this.w + 0.16,
          d: this.d + 0.16, h: 0.14, color: '#2b323b'
        });
        // main housing
        D.box(ctx, iso, {
          x: this.x, y: this.y, z: 0.14, w: this.w, d: this.d, h: this.h, color: c
        });
        // louvred vents on the front face
        for (let i = 0; i < 5; i++) {
          const vz = 0.34 + i * 0.16;
          D.fillPoly(ctx, iso, [
            [this.x + 0.2, this.y + this.d, vz], [this.x + this.w - 0.2, this.y + this.d, vz],
            [this.x + this.w - 0.2, this.y + this.d, vz - 0.08],
            [this.x + 0.2, this.y + this.d, vz - 0.08]
          ], Color.shade(c, -0.34), null, 0);
        }
        // accent band — side faces only, so the top stays a metal deck
        const bz0 = 0.14 + this.h - 0.26, bz1 = bz0 + 0.12;
        D.fillPoly(ctx, iso, [
          [this.x, this.y + this.d, bz1], [this.x + this.w, this.y + this.d, bz1],
          [this.x + this.w, this.y + this.d, bz0], [this.x, this.y + this.d, bz0]
        ], Color.shade(this.accent, -0.10), null, 0);
        D.fillPoly(ctx, iso, [
          [this.x + this.w, this.y, bz1], [this.x + this.w, this.y + this.d, bz1],
          [this.x + this.w, this.y + this.d, bz0], [this.x + this.w, this.y, bz0]
        ], Color.shade(this.accent, -0.34), null, 0);

        // ---- fan on the top deck, drawn in screen space -------------
        const fcx = this.x + this.w * 0.32, fcy = this.y + this.d * 0.5;
        const topZ = 0.14 + this.h;
        const FX = iso.x(fcx, fcy), FY = iso.y(fcx, fcy, topZ);
        const rx = 0.42 * iso.hw, ry = 0.42 * iso.hh;
        ctx.save();
        ctx.beginPath(); ctx.ellipse(FX, FY, rx, ry, 0, 0, 6.2832);
        ctx.fillStyle = '#191d23'; ctx.fill();
        ctx.strokeStyle = Color.shade(c, -0.5); ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath();
        for (let b = 0; b < 5; b++) {
          const a0 = this.fan + (b / 5) * 6.2832;
          ctx.moveTo(FX, FY);
          ctx.lineTo(FX + Math.cos(a0) * rx * 0.92, FY + Math.sin(a0) * ry * 0.92);
          ctx.lineTo(FX + Math.cos(a0 + 0.55) * rx * 0.7, FY + Math.sin(a0 + 0.55) * ry * 0.7);
          ctx.closePath();
        }
        ctx.fillStyle = 'rgba(160,178,198,.55)'; ctx.fill();
        ctx.beginPath(); ctx.ellipse(FX, FY, rx * 0.16, ry * 0.16, 0, 0, 6.2832);
        ctx.fillStyle = '#5a636e'; ctx.fill();
        ctx.restore();

        // ---- exhaust stack + pipes ---------------------------------
        D.cylinder(ctx, iso, this.x + this.w - 0.35, this.y + 0.3, topZ, 0.16, 0.75, '#39414b');
        D.cylinder(ctx, iso, this.x + this.w - 0.35, this.y + 0.3, topZ + 0.75, 0.2, 0.08, '#22282f');
        D.box(ctx, iso, {
          x: this.x + 0.25, y: this.y - 0.22, z: 0.2, w: 0.16, d: 0.22,
          h: this.h * 0.8, color: '#77808c'
        });

        // ---- gauges + status lamp ----------------------------------
        const live = this.active;
        const lamp = live ? '#7dffb0' : '#ff5f56';
        const blink = live ? 0.6 + 0.4 * Math.sin(this.age * 5 + this.x) : 0.3;
        D.glow(ctx, iso, this.x + 0.2, this.y + this.d, 0.14 + this.h - 0.1, 10, lamp, blink);
        ctx.save();
        ctx.globalAlpha = 0.8;
        D.fillPoly(ctx, iso, [
          [this.x + 0.45, this.y + this.d, 1.0], [this.x + 0.85, this.y + this.d, 1.0],
          [this.x + 0.85, this.y + this.d, 0.72], [this.x + 0.45, this.y + this.d, 0.72]
        ], '#101418', 'rgba(0,0,0,.6)', 1);
        const needle = 0.45 + 0.28 * (0.5 + 0.5 * Math.sin(this.age * 3.1 + this.y));
        D.fillPoly(ctx, iso, [
          [this.x + 0.48, this.y + this.d, 0.78],
          [this.x + 0.48 + needle * 0.7, this.y + this.d, 0.78]
        ], null, live ? '#7dffb0' : '#5a6470', 2);
        ctx.restore();
      });

      // ---- steam, above everything nearby --------------------------
      for (const p of this.puffs) {
        rl.add(rl.iso.depth(p.x, p.y, p.z, 9), (ctx, iso) => {
          const k = p.life / p.max;
          const X = iso.x(p.x, p.y), Y = iso.y(p.x, p.y, p.z);
          ctx.save();
          ctx.globalAlpha = (1 - k) * 0.22;
          ctx.beginPath();
          ctx.arc(X, Y, p.r * (1 + k * 2.4), 0, 6.2832);
          ctx.fillStyle = '#cfe0f0'; ctx.fill();
          ctx.restore();
        });
      }
    }
  }
