/* ===== js/engine.js ================================================== */
/* =====================================================================
   engine.js — canvas lifecycle, camera/input, the depth-sorted render
   list, the fixed-step simulation loop, and the Step-1 factory layout.
   ---------------------------------------------------------------------
   PUBLIC API (what Step 2 will build on)

     const g = window.GAME;
     g.iso                     projection (grid ⇄ screen)
     g.camera                  pan / zoom / auto-fit
     g.entities                live entity array
     g.add(entity)             insert (returns the entity)
     g.remove(entity|id)       delete
     g.byTag('conveyor')       lookup by tag
     g.pick(clientX, clientY)  screen px → {gx, gy, fx, fy} on the floor
                               plane (integer tile + the exact float), or
                               null when the point is off the plate
     g.paused = true|false
     g.onTick = (dt, time)=>{} fixed-step economy hook, 60 Hz
     g.onRender = (ctx, viewW, viewH) => {}
                               screen-space overlay hook, drawn last with
                               the camera transform removed
     g.onTileClick = ({gx, gy, fx, fy}) => {}   tap on a floor tile
   ===================================================================== */
(function (global) {
  'use strict';

  const { Iso, Camera, M } = global.ISO;
  const E = global.ENTITIES;

  const STEP = 1 / 60;         // fixed simulation step (seconds)
  const MAX_STEPS = 5;         // spiral-of-death guard after a tab stall

  /* =================================================================== */
  /*  RenderList — collects draw commands, sorts them by depth           */
  /* =================================================================== */
  class RenderList {
    constructor(iso) {
      this.iso = iso;
      this.pool = [];
      this.n = 0;
    }

    begin() { this.n = 0; }

    add(depth, fn) {
      let it = this.pool[this.n];
      if (it) { it.d = depth; it.i = this.n; it.fn = fn; }
      else this.pool[this.n] = { d: depth, i: this.n, fn };
      this.n++;
    }

    flush(ctx) {
      const list = this.pool.slice(0, this.n);
      // painter's algorithm; index breaks ties so the order is stable
      list.sort((a, b) => (a.d - b.d) || (a.i - b.i));
      const iso = this.iso;
      for (let k = 0; k < list.length; k++) {
        ctx.save();
        list[k].fn(ctx, iso);
        ctx.restore();
      }
      return list.length;
    }
  }

  /* =================================================================== */
  /*  Engine                                                             */
  /* =================================================================== */
  class Engine {
    constructor(canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
      this.iso = new Iso(64, 32, 32);
      this.camera = new Camera();
      this.rl = new RenderList(this.iso);

      this.entities = [];
      this.paused = false;
      this.time = 0;
      this.dpr = 1;
      this.viewW = 1; this.viewH = 1;

      this.world = { w: 24, d: 21, headroom: 4.6 };
      this.ground = null;

      this.onTick = null;      // «STEP-2 HOOK» economy update
      this.onRender = null;    // «STEP-2 HOOK» screen-space overlay

      this._acc = 0;
      this._last = 0;
      this._frames = 0; this._fpsClock = 0; this.fps = 0; this.drawCalls = 0;
      this._raf = 0;

      this._bindDom();
      this._bindInput();
      this.resize();
    }

    /* ------------------------------------------------------ entities */
    add(e) { this.entities.push(e); return e; }

    remove(target) {
      const id = typeof target === 'string' ? target : target && target.id;
      const i = this.entities.findIndex(e => e.id === id);
      if (i >= 0) this.entities.splice(i, 1);
      return i >= 0;
    }

    byTag(tag) { return this.entities.filter(e => e.tag === tag); }

    /* -------------------------------------------------------- canvas */
    _bindDom() {
      this.hud = {
        fps: document.getElementById('stat-fps'),
        draws: document.getElementById('stat-draws'),
        ents: document.getElementById('stat-ents'),
        zoom: document.getElementById('stat-zoom')
      };
    }

    /** Screen-space bounding box of the world at zoom 1. */
    worldBounds() {
      const iso = this.iso, W = this.world.w, D = this.world.d;
      return {
        minX: iso.x(0, D), maxX: iso.x(W, 0),
        minY: iso.y(0, 0, this.world.headroom), maxY: iso.y(W, D, -0.6)
      };
    }

    resize() {
      const c = this.canvas;
      const rect = c.getBoundingClientRect();
      const dpr = Math.min(global.devicePixelRatio || 1, 2.5);
      const w = Math.max(1, Math.round(rect.width));
      const h = Math.max(1, Math.round(rect.height));

      this.viewW = w; this.viewH = h; this.dpr = dpr;
      const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
      if (c.width !== bw || c.height !== bh) { c.width = bw; c.height = bh; }

      this.camera.fit(w, h, this.worldBounds(), 0.88);
      if (!this._booted) { this.camera.snap(); this._booted = true; }
    }

    /* --------------------------------------------------------- input */
    _bindInput() {
      const c = this.canvas, cam = this.camera;
      let dragging = false, lastX = 0, lastY = 0, moved = 0;

      const ro = new ResizeObserver(() => this.resize());
      ro.observe(c);
      global.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 120));

      c.addEventListener('pointerdown', ev => {
        dragging = true; moved = 0;
        lastX = ev.clientX; lastY = ev.clientY;
        c.setPointerCapture(ev.pointerId);
        c.classList.add('dragging');
      });

      c.addEventListener('pointermove', ev => {
        if (dragging) {
          const dx = ev.clientX - lastX, dy = ev.clientY - lastY;
          lastX = ev.clientX; lastY = ev.clientY;
          moved += Math.abs(dx) + Math.abs(dy);
          cam.pan(dx, dy);
        }
        this.hoverAt(ev.clientX, ev.clientY);
      });

      const end = ev => {
        if (!dragging) return;
        dragging = false;
        c.classList.remove('dragging');
        if (c.hasPointerCapture && c.hasPointerCapture(ev.pointerId)) {
          c.releasePointerCapture(ev.pointerId);
        }
        // «STEP-2 HOOK» a short press is a tap on the tile under the cursor
        if (moved < 6 && this.onTileClick) {
          const g = this.pick(ev.clientX, ev.clientY);
          if (g) this.onTileClick(g);
        }
      };
      c.addEventListener('pointerup', end);
      c.addEventListener('pointercancel', end);
      c.addEventListener('pointerleave', () => { if (this.ground) this.ground.hover = null; });

      c.addEventListener('wheel', ev => {
        ev.preventDefault();
        const r = c.getBoundingClientRect();
        cam.zoomAt(ev.clientX - r.left, ev.clientY - r.top,
          Math.pow(0.999, ev.deltaY * (ev.deltaMode === 1 ? 18 : 1)));
      }, { passive: false });

      global.addEventListener('keydown', ev => {
        const k = ev.key.toLowerCase();
        if (k === 'f') { cam.reset(); }
        else if (k === 'g') { if (this.ground) this.ground.showGrid = !this.ground.showGrid; }
        else if (k === ' ') { ev.preventDefault(); this.paused = !this.paused; }
      });

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) this._last = performance.now();   // drop the gap
      });
    }

    /** Canvas-relative screen px → floor grid coords (null if off-plate). */
    pick(clientX, clientY) {
      const r = this.canvas.getBoundingClientRect();
      const w = this.camera.toWorld(clientX - r.left, clientY - r.top);
      const g = this.iso.unproject(w.x, w.y, 0);
      const gx = Math.floor(g.gx), gy = Math.floor(g.gy);
      if (gx < 0 || gy < 0 || gx >= this.world.w || gy >= this.world.d) return null;
      return { gx, gy, fx: g.gx, fy: g.gy };
    }

    hoverAt(clientX, clientY) {
      if (!this.ground) return;
      this.ground.hover = this.pick(clientX, clientY);
    }

    /* ----------------------------------------------------------- loop */
    start() {
      this._last = performance.now();
      const frame = ts => {
        this._raf = requestAnimationFrame(frame);
        let dt = (ts - this._last) / 1000;
        this._last = ts;
        if (!(dt > 0)) dt = 0;
        if (dt > 0.25) dt = 0.25;          // clamp after a stall

        // ---- fixed-step simulation -------------------------------
        if (!this.paused) {
          this._acc += dt;
          let steps = 0;
          while (this._acc >= STEP && steps < MAX_STEPS) {
            this._acc -= STEP; steps++;
            this.time += STEP;
            for (let i = 0; i < this.entities.length; i++) {
              const e = this.entities[i];
              if (e.update) e.update(STEP, this.time);
            }
            if (this.onTick) this.onTick(STEP, this.time);
          }
          if (steps === MAX_STEPS) this._acc = 0;
        }

        this.camera.update(dt);
        this.render();

        // ---- diagnostics -----------------------------------------
        this._frames++; this._fpsClock += dt;
        if (this._fpsClock >= 0.5) {
          this.fps = Math.round(this._frames / this._fpsClock);
          this._frames = 0; this._fpsClock = 0;
          if (this.hud.fps) {
            this.hud.fps.textContent = this.fps;
            this.hud.draws.textContent = this.drawCalls;
            this.hud.ents.textContent = this.entities.length;
            this.hud.zoom.textContent = this.camera.zoom.toFixed(2);
          }
        }
      };
      this._raf = requestAnimationFrame(frame);
      return this;
    }

    stop() { cancelAnimationFrame(this._raf); }

    /* --------------------------------------------------------- render */
    render() {
      const ctx = this.ctx, cam = this.camera;

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#080b10';
      ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      ctx.translate(cam.x, cam.y);
      ctx.scale(cam.zoom, cam.zoom);

      const rl = this.rl;
      rl.begin();
      for (let i = 0; i < this.entities.length; i++) {
        const e = this.entities[i];
        if (e.collect) e.collect(rl);
      }
      this.drawCalls = rl.flush(ctx);

      // screen-space pass (no camera transform) — Step 2 overlays
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      if (this.paused) this._drawPaused(ctx);
      if (this.onRender) this.onRender(ctx, this.viewW, this.viewH);
    }

    _drawPaused(ctx) {
      ctx.save();
      ctx.fillStyle = 'rgba(6,9,13,.45)';
      ctx.fillRect(0, 0, this.viewW, this.viewH);
      ctx.fillStyle = '#ffc832';
      ctx.font = '700 13px "JetBrains Mono", ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('❚❚  PAUSED', this.viewW / 2, this.viewH / 2);
      ctx.restore();
    }
  }

  /* =================================================================== */
  /*  Factory layout — the Step-1 showcase scene                         */
  /* =================================================================== */
  function buildFactory(g) {

  /* =================================================================== */
  /*  Boot                                                               */
  /* =================================================================== */
  function boot() {
    const canvas = document.getElementById('factory-canvas');
    const engine = new Engine(canvas);
    buildFactory(engine);
    engine.resize();
    engine.camera.snap();
    engine.start();
    global.GAME = engine;

  global.FactoryEngine = { Engine, RenderList, buildFactory, boot };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);

/* =====================================================================

   upgrade axes, the level curve, and the objective chain.
   ---------------------------------------------------------------------
   Everything here is DATA plus pure functions. No state, no DOM, no
   canvas. economy.js owns the mutable save; binding.js pushes it at the
   renderer. Rebalancing the game means editing this file and nothing else.

   INCOME MODEL
     throughput(units/min) = base.rate  × speed × supply × robot
     value($/unit)         = base.value × quality × global
     income($/min)         = throughput × value

     Speed / Supply / Robot are unbounded levels with additive multipliers
     and exponential costs — the classic idle curve where each level buys
     slightly less than the last. Parts Quality is the discrete 1–5 star
     axis: rare, expensive, and the only lever on unit VALUE, so it stays

  /** Multiplier delivered by `level` on a given axis. */
  function axisMultiplier(axisId, level) {
    const a = AXIS_BY_ID[axisId];
    if (!a) return 1;
    if (a.kind === 'stars') {
      return STAR_VALUE[Math.max(0, Math.min(STAR_VALUE.length - 1, level - 1))];
    }
    return 1 + a.step * Math.max(0, level - 1);

  /**
   * Cost to buy the NEXT point on an axis. Returns Infinity at max — the
   * caller can compare against cash without special-casing the cap.
   */
  function axisCost(product, axisId, currentLevel) {
    const a = AXIS_BY_ID[axisId];
    if (!a || !product) return Infinity;
    if (currentLevel >= a.max) return Infinity;
    if (a.kind === 'stars') {
      return Math.ceil(product.tierBase * STAR_COST[currentLevel - 1]);
    }
    return Math.ceil(product.tierBase * a.costMul *
      Math.pow(a.growth, Math.max(0, currentLevel - 1)));
  }

   * buy max" controls Step 3 will hang off this.

  function axisBulkCost(product, axisId, currentLevel, count) {
    let total = 0, lvl = currentLevel;
    for (let i = 0; i < count; i++) {
      const c = axisCost(product, axisId, lvl);
      if (!isFinite(c)) break;
      total += c; lvl++;
    }
    return { cost: total, levels: lvl - currentLevel };
  }

  /** How many levels `budget` buys on an axis, and what that costs. */
  function axisAffordable(product, axisId, currentLevel, budget, cap) {
    let spent = 0, lvl = currentLevel, n = 0;
    const limit = cap == null ? 1000 : cap;   // 0 is a legitimate cap
    while (n < limit) {
      const c = axisCost(product, axisId, lvl);
      if (!isFinite(c) || spent + c > budget) break;
      spent += c; lvl++; n++;
    }
    return { cost: spent, levels: n };

   * polynomial curve gets outrun and the player pins the level cap in a
   * few days, collapsing every unlock gate into one moment. The geometric
   * term keeps levels meaningful for the whole run: ~level 3 in the first
   * hour, the last unlock gate (36) inside a couple of days, and triple
   * digits still worth chasing deep into the late game.

  const LEVEL_CAP = 999;

   ---------------------------------------------------------------------

   renderer is driven from binding.js, which reads this. That split is

  /* =================================================================== */

      } catch (e) { return false; }   // private mode, blocked cookies, SSR

    set(key, val) {

    /* ------------------------------------------------------- lifecycle */
    reset(silent) {

        unlocksBought: 0, objectivesDone: 0,

    /* ---------------------------------------------------------- lookup */

    /* ================================================================= */

     * settlement automatically runs unboosted because the stamps are stale
     * by the time a save is reloaded.
     */
    boosterMultiplier(kind) {

    }

    /** Combined throughput multiplier from the three volume axes. */
    throughputMultiplier(id) {

        axisMultiplier('supply', l.supply) *
        axisMultiplier('robot', l.robot) *
        this.boosterMultiplier('throughput');

    /** Units per minute produced by a line (0 when locked). */
    throughputPerMinute(id) {

      if (!l || !p || !l.unlocked) return 0;
      return p.rate * this.throughputMultiplier(id);
    }

    /** $ per unit — base value scaled by parts quality and any global. */
    valuePerUnit(id) {
      const l = this.lines[id], p = getProduct(id);
      if (!l || !p) return 0;
      return p.value * axisMultiplier('quality', l.quality) *
        this.globalMultiplier * this.boosterMultiplier('income');

    /** ← the passive income calculator, per line. */
    lineIncomePerMinute(id) {
      return this.throughputPerMinute(id) * this.valuePerUnit(id);

    incomePerMinute() {

      for (let i = 0; i < LIST.length; i++) sum += this.lineIncomePerMinute(LIST[i].id);

    }

      for (let i = 0; i < LIST.length; i++) {

    upgradePreview(id, axisId) {

      const axis = getAxis(axisId);
      const before = this.lineIncomePerMinute(id);
      const prev = l[axisId];
      if (prev >= axis.max) return { cost: Infinity, gain: 0, maxed: true, before, after: before };

      const after = this.lineIncomePerMinute(id);
      l[axisId] = prev;
      const cost = axisCost(getProduct(id), axisId, prev);

      return {

        current: Math.min(cur, o.target), target: o.target,
        progress: Math.min(1, cur / o.target),
        label: (o.money ? Format.money(Math.min(cur, o.target)) : Format.num(Math.min(cur, o.target))) +

        done: !!this.objectives.done[o.id]

      const active = [];

      }

        this.stats.objectivesDone++;
        if (o.reward) {
          if (o.reward.cash) {
            this.cash += o.reward.cash;
            this.stats.totalEarned += o.reward.cash;
          }
          if (o.reward.xp) this.addXp(o.reward.xp);
        }
        this.emit('objective', { id: o.id, name: o.name, reward: o.reward });
      }
    }

    /* ================================================================= */
    /*  Save / load                                                      */
    /* ================================================================= */
    serialize() {
      const lines = {};
      for (const id in this.lines) {
        const l = this.lines[id];
        lines[id] = {
          u: l.unlocked ? 1 : 0,
          s: l.speed, p: l.supply, r: l.robot, q: l.quality,
          n: l.shipped, f: +l._partial.toFixed(4), e: l.earned
        };
      }
      return {
        v: BALANCE.saveVersion,
        t: now(),
        cash: this.cash, level: this.level, xp: this.xp,
        sel: this.selectedLine,
        gm: this.globalMultiplier,
        lines,
        obj: this.objectives.done,
        boost: this.boosters,
        stats: this.stats
      };
    }

    save() {
      this.lastSaved = now();
      let ok = false;
      try {
        const blob = JSON.stringify(this.serialize());
        ok = Storage.set(this.saveKey, blob);
      } catch (e) {
        console.error('[economy] save failed:', e);
      }
      this.emit('save', { ok, at: this.lastSaved });
      return ok;
    }

    /**
     * Load, migrate, and settle offline earnings.
     * @returns {object|null} the offline report, or null on a fresh start.
     */
    load() {
      const raw = Storage.get(this.saveKey);
      if (!raw) { this.emit('load', { fresh: true }); return null; }

      let data;
      try { data = JSON.parse(raw); }
      catch (e) {
        console.warn('[economy] corrupt save discarded');
        Storage.remove(this.saveKey);
        this.emit('load', { fresh: true, corrupt: true });
        return null;
      }
      if (!data || typeof data !== 'object') { this.emit('load', { fresh: true }); return null; }

      this.applySave(this.migrate(data));
      const report = this.settleOffline(data.t);
      this.emit('load', { fresh: false, offline: report });
      return report;
    }

    /** Forward-migrate older schemas. v1 is the baseline. */
    migrate(data) {
      if (!data.v || data.v < 1) data.v = 1;
      return data;
    }

    applySave(d) {
      const num = (v, fallback) => (typeof v === 'number' && isFinite(v) ? v : fallback);
      const int = (v, fallback, lo, hi) => {
        const n = Math.floor(num(v, fallback));
        return Math.max(lo, Math.min(hi, n));
      };

      this.cash = Math.max(0, num(d.cash, 0));
      this.level = int(d.level, 1, 1, 999);
      this.xp = Math.max(0, num(d.xp, 0));
      this.globalMultiplier = num(d.gm, 1);
      this.selectedLine = getProduct(d.sel) ? d.sel : LIST[0].id;

      LIST.forEach(p => {
        const l = this.lines[p.id];
        const s = (d.lines && d.lines[p.id]) || null;
        if (!s) return;
        l.unlocked = !!s.u;
        l.speed = int(s.s, 1, 1, 500);
        l.supply = int(s.p, 1, 1, 500);
        l.robot = int(s.r, 1, 1, 500);
        l.quality = int(s.q, 1, 1, 5);
        l.shipped = Math.max(0, Math.floor(num(s.n, 0)));
        l._partial = Math.max(0, num(s.f, 0));
        l.earned = Math.max(0, num(s.e, 0));
      });
      // the starter line is never locked, whatever the save claims
      this.lines[LIST[0].id].unlocked = true;

      if (d.obj && typeof d.obj === 'object') {
        const done = {};
        for (const o of OBJECTIVES) if (d.obj[o.id]) done[o.id] = d.obj[o.id];
        this.objectives.done = done;
      }
      if (d.boost && typeof d.boost === 'object') {
        const b = {};
        for (const def of BOOSTERS) {
          const s = d.boost[def.id];
          if (!s) continue;
          b[def.id] = { until: num(s.until, 0), cdUntil: num(s.cdUntil, 0) };
        }
        this.boosters = b;
      }
      if (d.stats && typeof d.stats === 'object') {
        for (const k in this.stats) {
          this.stats[k] = num(d.stats[k], this.stats[k]);
        }
      }
    }

    /* ================================================================= */
    /*  Offline earnings — capped at 24 h at reduced efficiency          */
    /* ================================================================= */
    settleOffline(savedAt) {
      const stamp = (typeof savedAt === 'number' && isFinite(savedAt)) ? savedAt : 0;
      const away = (now() - stamp) / 1000;

      // negative = clock moved backwards; ignore rather than pay out
      if (!(away > BALANCE.offlineMinSeconds)) { this.offlineReport = null; return null; }

      const capped = Math.min(away, BALANCE.offlineCapSeconds);
      const rateBefore = this.incomePerMinute();
      const got = this._accrue(capped, this.offlineEfficiency);

      this.stats.offlineEarned += got.cash;
      const report = {
        away, awaySeconds: capped,
        capped: away > BALANCE.offlineCapSeconds,
        capHours: BALANCE.offlineCapSeconds / 3600,
        efficiency: this.offlineEfficiency,
        ratePerMinute: rateBefore,
        earned: got.cash, units: got.units, xp: got.xp,
        text: Format.money(got.cash) + ' while away for ' + Format.time(away)
      };
      this.offlineReport = report;
      this.checkObjectives();
      this.emit('offline', report);
      return report;
    }

    /** Wipe the save and start over. */
    hardReset() {
      Storage.remove(this.saveKey);
      this.reset(false);
      this.save();
    }

    /* ------------------------------------------------- debug / support */
    snapshot() {
      return {
        cash: Format.money(this.cash),
        rate: Format.rate(this.incomePerMinute()),
        level: this.level,
        xp: Math.floor(this.xp) + '/' + this.xpToNext(),
        lines: this.unlockedLines().map(p => p.id + ' ' +
          Format.rate(this.lineIncomePerMinute(p.id))),
        objectives: this.activeObjectives().map(o => o.name + ' ' + o.label)
      };
    }

    /** Persist on the way out — tab close, backgrounding, mobile swipe-away. */
    installLifecycleHooks() {
      const flush = () => { this._saveClock = 0; this.save(); };
      global.addEventListener('beforeunload', flush);
      global.addEventListener('pagehide', flush);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) flush();
        else if (this.settleOnReturn !== false) {
          // a backgrounded tab throttles rAF; settle the gap as offline time
          const r = this.settleOffline(this.lastSaved);
          if (r) this.emit('resume', r);
        }
      });
      return this;
    }
  }

  /* =================================================================== */
  global.ECONOMY = { GameState, Storage, Emitter, Format };
})(window);

/* ===== js/binding.js ================================================= */
/* =====================================================================
   binding.js — the seam between the economy and the renderer.
   ---------------------------------------------------------------------
   The state is authoritative and continuous: money accrues from a rate,
   never from a crate touching a truck. The factory floor is a VIEW of
   that rate. Keeping the causality one-way (state → visuals, never the
   reverse) is what stops a dropped frame, a background tab, or an offline
   catch-up from desyncing the books.

   What the floor shows for the selected line:
     throughput   → belt speed, payload density, arm cycle, truck cadence
     parts quality→ share of premium-coloured payload + arm payload colour
     the product  → the entire payload palette

   Because upgrade multipliers are unbounded but belt speed is not, every
   mapping runs through a log compressor: each 10× of throughput buys one
   more "step" of visible motion, so level 5 and level 500 both read
   correctly without the belt turning into a blur.

     const { state, binding } = BINDING.bootGame(GAME);
     // afterwards: window.STATE (economy) and window.VIEW (this binding)
   ===================================================================== */
(function (global) {
  'use strict';

  const { M } = global.ISO;
  const P = global.PRODUCTS;
  const Format = P.Format;

  /* Visible motion limits — the floor never exceeds these, whatever the
     economy says. */
  const VIS = {
    beltMin: 0.75, beltMax: 4.2,
    armMin: 0.85, armMax: 3.9,       // seconds per pick-and-place cycle
    spacingMin: 0.5, spacingMax: 1.7,
    truckWaitMin: 1.8, truckWaitMax: 5.6,
    lerp: 2.5                        // how fast visuals chase a new target
  };

  /** 1 at rest, +1 per decade of throughput. Keeps late game legible. */
  function compress(mult) {
    return 1 + Math.log10(Math.max(1, mult));
  }

  /* =================================================================== */
  class FactoryBinding {
    constructor(engine, state) {
      this.engine = engine;
      this.state = state;

      this.belts = engine.byTag('conveyor');
      this.arms = engine.byTag('arm');
      this.trucks = engine.byTag('truck');
      this.docks = engine.byTag('dock');

      // live values, eased toward the targets computed in sync()
      this.beltSpeed = 1.1;
      this.armCycle = 3.4;
      this.target = { beltSpeed: 1.1, armCycle: 3.4, spacing: 1.4, truckWait: 4.6 };

      this.lineId = state.selectedLine;

      // re-derive whenever anything economic moves
      this._off = state.on('change', () => this.sync());
      state.on('unlock', e => { if (e && e.id) this.setLine(e.id); });

      this.setLine(this.lineId, true);
    }

    dispose() { if (this._off) this._off(); }

    /* ---------------------------------------------------------- palette */
    /**
     * Payload pool for a line: the product's own colours, with a share of
     * premium (accent-tinted, slightly larger) pieces that grows with the
     * parts-quality stars — so a 5★ line visibly ships better goods.
     */
    paletteFor(product, stars) {
      const pool = product.palette.map(k => ({ color: k.color, size: k.size }));
      const premium = Math.max(0, stars - 1);          // 0 … 4
      for (let i = 0; i < premium; i++) {
        pool.push({ color: product.accent, size: 0.34 + i * 0.012 });
      }
      return pool;
    }

    /* ------------------------------------------------------------ line */
    /** Point the factory floor at a different production line. */
    setLine(id, force) {
      const st = this.state;
      if (!st.line(id) || !st.line(id).unlocked) return false;
      if (!force && id === this.lineId) return false;

      this.lineId = id;
      st.selectedLine = id;

      const product = st.product(id);
      const kinds = this.paletteFor(product, st.line(id).quality);
      this.belts.forEach(b => b.setKinds(kinds));
      this.arms.forEach((a, i) => {
        a.payloadColor = product.palette[i % product.palette.length].color;
      });

      this.sync();
      if (force !== true) st.emit('select', { id, product });
      return true;
    }

    /* ------------------------------------------------------------ sync */
    /** Recompute visual targets from the current economy state. */
    sync() {
      const st = this.state, id = this.lineId;
      const line = st.line(id);
      if (!line) return;

      // quality changed → refresh the premium share of the payload
      const stars = line.quality;
      if (stars !== this._stars) {
        this._stars = stars;
        const kinds = this.paletteFor(st.product(id), stars);
        this.belts.forEach(b => b.setKinds(kinds));
      }

      const power = compress(st.throughputMultiplier(id));   // 1 → ~4
      const t = this.target;
      t.beltSpeed = M.clamp(0.78 * power, VIS.beltMin, VIS.beltMax);
      t.armCycle = M.clamp(3.9 / (0.55 + 0.45 * power), VIS.armMin, VIS.armMax);
      t.spacing = M.clamp(1.9 - 0.34 * power, VIS.spacingMin, VIS.spacingMax);
      t.truckWait = M.clamp(6.2 - 1.1 * power, VIS.truckWaitMin, VIS.truckWaitMax);
    }

    /* ---------------------------------------------------------- update */
    update(dt) {
      const t = this.target;

      // ease the continuous values so an upgrade spins the floor up
      this.beltSpeed = M.damp(this.beltSpeed, t.beltSpeed, VIS.lerp, dt);
      this.armCycle = M.damp(this.armCycle, t.armCycle, VIS.lerp, dt);

      for (let i = 0; i < this.belts.length; i++) {
        const b = this.belts[i];
        // the feeder line runs a touch hotter than the two main runs
        b.speed = this.beltSpeed * (b.dir === '+y' ? 1.3 : 1);
        b.setSpacing(t.spacing);
      }
      for (let i = 0; i < this.arms.length; i++) {
        // stagger the arms so they never beat in lockstep
        this.arms[i].cycle = this.armCycle * (1 + i * 0.06);
      }
      for (let i = 0; i < this.trucks.length; i++) this.trucks[i].wait = t.truckWait;
    }
  }

  /* =================================================================== */
  /*  Boot — wire state, binding and engine together                     */
  /* =================================================================== */
  function bootGame(engine) {
    if (!engine) { console.error('[isofactory] no engine to bind to'); return null; }
    const state = new global.ECONOMY.GameState();
    const report = state.load();
    state.installLifecycleHooks();

    const binding = new FactoryBinding(engine, state);

    // one fixed-step hook drives the books, then the floor that shows them
    engine.onTick = dt => { state.tick(dt); binding.update(dt); };

    // «STEP-3 HOOK» this is where the welcome-back modal will read from
    if (report) {
      console.log('[isofactory] offline: ' + report.text +
        ' (' + Format.pct(report.efficiency) + ' rate' +
        (report.capped ? ', capped at ' + report.capHours + 'h' : '') + ')');
    }

    global.STATE = state;
    global.VIEW = binding;
    return { state, binding, report };
  }

  global.BINDING = { FactoryBinding, bootGame, compress, VIS };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => bootGame(global.GAME));
  } else {
    bootGame(global.GAME);
  }
})(window);

/* ===== js/audio.js =================================================== */
/* =====================================================================
   audio.js — procedural sound. No samples, no files: every effect is
   synthesised from oscillators and noise buffers at call time.
   ---------------------------------------------------------------------
   Three things make this survive contact with a real game:

   1. LAZY CONTEXT. Browsers refuse to start an AudioContext without a
      user gesture. Construction is deferred to the first real interaction
      and `resume()` is retried on every play, so nothing is lost if the
      first gesture was consumed elsewhere.

   2. THROTTLING. Belt deliveries and arm cycles fire far faster than the
      ear wants. Every effect declares a minimum gap and silently drops
      calls inside it, so a 10× speed upgrade doesn't turn into a buzzsaw.

   3. HEADROOM. Everything runs through one gain into a compressor, so a
      level-up landing on top of four assembly clicks ducks instead of
      clipping. A generated impulse response adds a short room so the
      blips don't sound like they were recorded in a vacuum.

     const synth = new AUDIO.Synth();
     synth.unlockOnGesture();
     synth.play('levelup');
   ===================================================================== */
(function (global) {
  'use strict';

  const AC = global.AudioContext || global.webkitAudioContext;

  /** Minimum seconds between repeats, per effect. */
  const THROTTLE = {
    assembly: 0.085, money: 0.10, click: 0.03, upgrade: 0.05,
    truck: 0.9, levelup: 0.35, unlock: 0.3, objective: 0.25, error: 0.15
  };

  const PREF_KEY = 'isofactory.audio.v1';

  class Synth {
    constructor(opts) {
      this.ctx = null;
      this.master = null;
      this.wet = null;
      this.volume = (opts && opts.volume) || 0.55;
      this.muted = false;
      this._last = {};
      this._chain = 0;          // consecutive money blips, for the pitch run
      this._chainAt = 0;
      this._started = false;

      // restore the player's mute choice before anything can make noise
      try {
        const p = JSON.parse(global.localStorage.getItem(PREF_KEY) || '{}');
        if (typeof p.muted === 'boolean') this.muted = p.muted;
        if (typeof p.volume === 'number') this.volume = p.volume;
      } catch (e) { /* storage blocked — defaults are fine */ }
    }

    /* ------------------------------------------------------------ setup */
    /** Build the context on the first gesture of any kind. */
    unlockOnGesture(target) {
      const el = target || global;
      const go = () => { this.ensure(); };
      ['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
        el.addEventListener(ev, go, { once: false, passive: true }));
      return this;
    }

    ensure() {
      if (!AC) return null;
      if (!this.ctx) {
        try { this.ctx = new AC(); } catch (e) { return null; }

        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : this.volume;

        // one compressor for the whole game keeps overlapping cues sane
        const comp = this.ctx.createDynamicsCompressor();
        comp.threshold.value = -18;
        comp.knee.value = 22;
        comp.ratio.value = 8;
        comp.attack.value = 0.003;
        comp.release.value = 0.18;

        this.master.connect(comp);
        comp.connect(this.ctx.destination);

        // small generated room, mixed in behind everything
        const rev = this.ctx.createConvolver();
        rev.buffer = this._impulse(0.55, 2.6);
        this.wet = this.ctx.createGain();
        this.wet.gain.value = 0.16;
        this.wet.connect(rev);
        rev.connect(this.master);

        this._started = true;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    }

    /** Exponentially decaying noise — a cheap, decent small-room IR. */
    _impulse(seconds, decay) {
      const rate = this.ctx.sampleRate;
      const len = Math.max(1, Math.floor(rate * seconds));
      const buf = this.ctx.createBuffer(2, len, rate);
      for (let c = 0; c < 2; c++) {
        const d = buf.getChannelData(c);
        for (let i = 0; i < len; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
        }
      }
      return buf;
    }

    _noiseBuffer(seconds) {
      const rate = this.ctx.sampleRate;
      const len = Math.max(1, Math.floor(rate * seconds));
      const buf = this.ctx.createBuffer(1, len, rate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return buf;
    }

    /* ----------------------------------------------------------- mixing */
    setMuted(m) {
      this.muted = !!m;
      if (this.master) {
        const t = this.ctx.currentTime;
        this.master.gain.cancelScheduledValues(t);
        this.master.gain.setTargetAtTime(this.muted ? 0 : this.volume, t, 0.02);
      }
      this._savePrefs();
      return this.muted;
    }

    toggleMute() { return this.setMuted(!this.muted); }

    setVolume(v) {
      this.volume = Math.max(0, Math.min(1, v));
      if (this.master && !this.muted) {
        this.master.gain.setTargetAtTime(this.volume, this.ctx.currentTime, 0.02);
      }
      this._savePrefs();
    }

    _savePrefs() {
      try {
        global.localStorage.setItem(PREF_KEY,
          JSON.stringify({ muted: this.muted, volume: this.volume }));
      } catch (e) { /* ignore */ }
    }

    /* --------------------------------------------------------- plumbing */
    /** Gate: false when muted, contextless, or inside the throttle window. */
    _gate(name) {
      if (this.muted) return false;
      const ctx = this.ensure();
      if (!ctx || ctx.state !== 'running') return false;
      const gap = THROTTLE[name] || 0.05;
      const t = ctx.currentTime;
      if (this._last[name] != null && t - this._last[name] < gap) return false;
      this._last[name] = t;
      return true;
    }

    /**
     * One shaped voice: oscillator → gain (ADSR-ish) → destination, with a
     * send to the room. Everything below is composed from this.
     */
    _voice(o) {
      const ctx = this.ctx, t0 = ctx.currentTime + (o.delay || 0);
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(o.freq, t0);
      if (o.freqTo) {
        if (o.slide === 'linear') osc.frequency.linearRampToValueAtTime(o.freqTo, t0 + o.dur);
        else osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.freqTo), t0 + o.dur);
      }
      if (o.detune) osc.detune.setValueAtTime(o.detune, t0);

      const peak = (o.gain == null ? 0.2 : o.gain);
      const atk = o.attack == null ? 0.005 : o.attack;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak), t0 + atk);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);

      let node = osc;
      if (o.filter) {
        const f = ctx.createBiquadFilter();
        f.type = o.filter;
        f.frequency.setValueAtTime(o.cutoff || 900, t0);
        if (o.cutoffTo) f.frequency.exponentialRampToValueAtTime(Math.max(20, o.cutoffTo), t0 + o.dur);
        f.Q.value = o.q == null ? 1 : o.q;
        node.connect(f); node = f;
      }
      node.connect(gain);
      gain.connect(this.master);
      if (o.room !== false) gain.connect(this.wet);

      osc.start(t0);
      osc.stop(t0 + o.dur + 0.05);
      return osc;
    }

    /** Filtered noise burst — impacts, air, engine texture. */
    _noise(o) {
      const ctx = this.ctx, t0 = ctx.currentTime + (o.delay || 0);
      const src = ctx.createBufferSource();
      src.buffer = this._noiseBuffer(Math.max(0.05, o.dur));

      const f = ctx.createBiquadFilter();
      f.type = o.filter || 'bandpass';
      f.frequency.setValueAtTime(o.cutoff || 1200, t0);
      if (o.cutoffTo) f.frequency.exponentialRampToValueAtTime(Math.max(20, o.cutoffTo), t0 + o.dur);
      f.Q.value = o.q == null ? 1.2 : o.q;

      const gain = ctx.createGain();
      const peak = o.gain == null ? 0.12 : o.gain;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak), t0 + (o.attack || 0.004));
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);

      src.connect(f); f.connect(gain); gain.connect(this.master);
      if (o.room !== false) gain.connect(this.wet);
      src.start(t0);
      src.stop(t0 + o.dur + 0.05);
      return src;
    }

    /* ============================================================ cues */

    /** A part landing on the belt: soft mechanical tick + servo blip. */
    assembly() {
      if (!this._gate('assembly')) return false;
      this._noise({ dur: 0.055, cutoff: 2600, cutoffTo: 900, q: 1.4, gain: 0.055 });
      this._voice({
        type: 'square', freq: 320, freqTo: 190, dur: 0.07,
        gain: 0.035, filter: 'lowpass', cutoff: 1800
      });
      return true;
    }

    /**
     * Money. Consecutive blips inside a second walk up a pentatonic run,
     * so a fast line reads as a satisfying cascade rather than one pitch
     * hammered over and over.
     */
    money() {
      if (!this._gate('money')) return false;
      const t = this.ctx.currentTime;
      if (t - this._chainAt > 0.9) this._chain = 0;
      this._chainAt = t;
      const steps = [0, 2, 4, 7, 9, 12, 14, 16];
      const semi = steps[Math.min(this._chain, steps.length - 1)];
      this._chain++;
      const f = 784 * Math.pow(2, semi / 12);
      this._voice({ type: 'triangle', freq: f, dur: 0.11, gain: 0.10, attack: 0.003 });
      this._voice({ type: 'sine', freq: f * 2, dur: 0.07, gain: 0.045, delay: 0.012 });
      return true;
    }

    /** Truck pulling away: diesel note dropping under a tyre-noise sweep. */
    truck() {
      if (!this._gate('truck')) return false;
      this._voice({
        type: 'sawtooth', freq: 78, freqTo: 41, dur: 1.35, gain: 0.16,
        filter: 'lowpass', cutoff: 420, cutoffTo: 150, q: 3, attack: 0.06
      });
      this._voice({
        type: 'square', freq: 39, freqTo: 21, dur: 1.2, gain: 0.07,
        filter: 'lowpass', cutoff: 260
      });
      this._noise({
        dur: 1.1, filter: 'bandpass', cutoff: 900, cutoffTo: 260,
        q: 0.8, gain: 0.05, attack: 0.12
      });
      // air brake on release
      this._noise({ dur: 0.3, filter: 'highpass', cutoff: 2400, gain: 0.05, delay: 0.9 });
      return true;
    }

    /** Level up: rising major arpeggio with a shimmering octave on top. */
    levelup() {
      if (!this._gate('levelup')) return false;
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((f, i) => {
        this._voice({
          type: 'triangle', freq: f, dur: 0.42, gain: 0.13,
          delay: i * 0.085, attack: 0.008
        });
        this._voice({
          type: 'sawtooth', freq: f * 2, dur: 0.3, gain: 0.035,
          delay: i * 0.085, detune: 7, filter: 'lowpass', cutoff: 4200
        });
      });
      this._voice({
        type: 'sine', freq: 1046.5, freqTo: 1568, dur: 0.9,
        gain: 0.07, delay: 0.34, attack: 0.05
      });
      return true;
    }

    /** New production line: short three-note fanfare, fifths stacked. */
    unlock() {
      if (!this._gate('unlock')) return false;
      [[392, 0], [587.33, 0.1], [783.99, 0.2]].forEach(([f, d]) => {
        this._voice({ type: 'sawtooth', freq: f, dur: 0.5, gain: 0.09, delay: d, filter: 'lowpass', cutoff: 3000, q: 2 });
        this._voice({ type: 'triangle', freq: f * 1.5, dur: 0.4, gain: 0.05, delay: d });
      });
      this._noise({ dur: 0.5, filter: 'highpass', cutoff: 5200, gain: 0.03, delay: 0.2 });
      return true;
    }

    /** Upgrade bought: two-step ratchet up. */
    upgrade() {
      if (!this._gate('upgrade')) return false;
      this._voice({ type: 'square', freq: 660, dur: 0.07, gain: 0.06, filter: 'lowpass', cutoff: 2600 });
      this._voice({ type: 'square', freq: 990, dur: 0.1, gain: 0.06, delay: 0.06, filter: 'lowpass', cutoff: 3200 });
      return true;
    }

    /** Objective cleared: bell pair with a long tail. */
    objective() {
      if (!this._gate('objective')) return false;
      this._voice({ type: 'sine', freq: 1568, dur: 0.8, gain: 0.10, attack: 0.004 });
      this._voice({ type: 'sine', freq: 2093, dur: 1.1, gain: 0.06, delay: 0.06 });
      this._voice({ type: 'sine', freq: 3136, dur: 0.5, gain: 0.025, delay: 0.1 });
      return true;
    }

    /** UI tap. */
    click() {
      if (!this._gate('click')) return false;
      this._voice({
        type: 'triangle', freq: 1250, freqTo: 900, dur: 0.035,
        gain: 0.05, room: false
      });
      return true;
    }

    /** Rejected action — can't afford, on cooldown, still locked. */
    error() {
      if (!this._gate('error')) return false;
      this._voice({
        type: 'square', freq: 168, freqTo: 110, dur: 0.16, gain: 0.07,
        filter: 'lowpass', cutoff: 900, room: false
      });
      return true;
    }

    /** Generic dispatch, so callers can be data-driven. */
    play(name) {
      const fn = this[name];
      return typeof fn === 'function' ? fn.call(this) : false;
    }
  }

  global.AUDIO = { Synth, THROTTLE };
})(window);

/* ===== js/ui.js ====================================================== */
/* =====================================================================
   ui.js — the game shell: header, tabs, panels, modals, toasts, canvas
   floaters, and every event listener that joins them to the state and
   the renderer.
   ---------------------------------------------------------------------
   Two rules keep a 60 fps canvas and a DOM UI coexisting:

   1. NOTHING REBUILDS PER FRAME. Rows are constructed once and cached by
      id; the refresh loop only writes textContent and bar widths. DOM is
      rebuilt exclusively on structural change (a line unlocks, the viewed
      line switches).
   2. THE UI POLLS, THE STATE PUSHES. Values that change continuously
      (cash, rate, XP, cooldowns) are read on a 10 Hz timer; discrete
      events (upgrade, unlock, levelup, objective) arrive as state events
      and drive sound, toasts and re-renders.

   Boots last: it wraps engine.onTick so the economy still ticks first,
   and claims engine.onRender for the screen-space floater pass that
   Step 1 reserved.
   ===================================================================== */
(function (global) {
  'use strict';

  const P = global.PRODUCTS;
  const Format = P.Format;

  const el = id => document.getElementById(id);
  const make = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };

  /* =================================================================== */
  class GameUI {
    constructor(engine, state, view, synth) {
      this.engine = engine;
      this.state = state;
      this.view = view;
      this.synth = synth;

      this.tab = null;            // 'products' | 'factory' | null (closed)
      this.buyAmount = 1;         // 1 | 10 | 'max'
      this.floaters = [];
      this._clock = 0;
      this._rows = { product: new Map(), axis: new Map(), booster: new Map() };

      this.dom = {
        cash: el('ui-cash'), rate: el('ui-rate'),
        level: el('ui-level'), xp: el('ui-xp'),
        objName: el('ui-obj-name'), objFill: el('ui-obj-fill'),
        objCount: el('ui-obj-count'), objReward: el('ui-obj-reward'),
        objective: el('ui-objective'),
        boostStrip: el('ui-boost-strip'),
        sheet: el('sheet'), tabs: el('tabs'),
        panels: { products: el('panel-products'), factory: el('panel-factory') },
        productRows: el('ui-product-rows'), axisRows: el('ui-axis-rows'),
        boosterRows: el('ui-booster-rows'),
        factoryTitle: el('ui-factory-title'), lineSummary: el('ui-line-summary'),
        linesNote: el('ui-lines-note'),
        mute: el('ui-mute'), muteIcon: el('ui-mute-icon'),
        diag: el('ui-diag'), toasts: el('toasts'),
        modalBoosters: el('modal-boosters'), modalOffline: el('modal-offline'),
        offAway: el('ui-offline-away'), offAmount: el('ui-offline-amount'),
        offFine: el('ui-offline-fine'), offCollect: el('ui-offline-collect'),
        buyAmt: el('ui-buyamt')
      };

      this.buildProducts();
      this.buildAxes();
      this.buildBoosters();
      this.bindUI();
      this.bindState();
      this.bindWorld();

      this.dom.muteIcon.textContent = synth.muted ? '🔇' : '🔊';
      this.dom.mute.setAttribute('aria-pressed', String(synth.muted));

      this.setTab('products', true);
      this.refresh(true);

      if (state.offlineReport) this.showOffline(state.offlineReport);
    }

    /* ================================================================= */
    /*  Construction                                                     */
    /* ================================================================= */
    buildProducts() {
      const frag = document.createDocumentFragment();
      P.PRODUCTS.forEach(p => {
        const row = make('button', 'prow');
        row.type = 'button';
        row.dataset.id = p.id;
        row.innerHTML =
          '<span class="pswatch" style="--c:' + p.accent + '"></span>' +
          '<span class="pmain">' +
          '<span class="pname">' + p.name + '<em class="pstars"></em></span>' +
          '<span class="psub"></span></span>' +
          '<span class="pright"><span class="prate"></span>' +
          '<span class="pcta"></span></span>';
        frag.appendChild(row);
        this._rows.product.set(p.id, {
          row,
          stars: row.querySelector('.pstars'),
          sub: row.querySelector('.psub'),
          rate: row.querySelector('.prate'),
          cta: row.querySelector('.pcta')
        });
      });
      this.dom.productRows.appendChild(frag);
    }

    buildAxes() {
      const frag = document.createDocumentFragment();
      P.AXES.forEach(a => {
        const row = make('div', 'arow');
        row.dataset.axis = a.id;
        row.innerHTML =
          '<div class="ahead"><span class="aname">' + a.name + '</span>' +
          '<span class="alvl"></span></div>' +
          '<div class="adesc">' + a.desc + '</div>' +
          '<div class="ameter"><i></i></div>' +
          '<div class="afoot"><span class="amult"></span>' +
          '<button class="abuy" type="button"></button></div>';
        frag.appendChild(row);
        this._rows.axis.set(a.id, {
          row,
          lvl: row.querySelector('.alvl'),
          meter: row.querySelector('.ameter i'),
          mult: row.querySelector('.amult'),
          buy: row.querySelector('.abuy')
        });
      });
      this.dom.axisRows.appendChild(frag);
    }

    buildBoosters() {
      const frag = document.createDocumentFragment();
      P.BOOSTERS.forEach(b => {
        const row = make('div', 'brow');
        row.dataset.id = b.id;
        row.style.setProperty('--c', b.tone);
        row.innerHTML =
          '<span class="bico">' + b.icon + '</span>' +
          '<span class="bmain"><span class="bname">' + b.name + '</span>' +
          '<span class="bdesc">' + b.desc + '</span>' +
          '<span class="bmeter"><i></i></span></span>' +
          '<button class="cta bcta" type="button"></button>';
        frag.appendChild(row);
        this._rows.booster.set(b.id, {
          row,
          meter: row.querySelector('.bmeter i'),
          cta: row.querySelector('.bcta')
        });
      });
      this.dom.boosterRows.appendChild(frag);
    }

    /* ================================================================= */
    /*  Event listeners — UI → state                                     */
    /* ================================================================= */
    bindUI() {
      // ---- tabs ----------------------------------------------------
      this.dom.tabs.addEventListener('click', ev => {
        const btn = ev.target.closest('.tab');
        if (!btn) return;
        this.synth.click();
        const name = btn.dataset.tab;
        if (name === 'boosters') { this.openModal('boosters'); return; }
        this.setTab(this.tab === name ? null : name);
      });

      // ---- product rows: select, or unlock -------------------------
      this.dom.productRows.addEventListener('click', ev => {
        const row = ev.target.closest('.prow');
        if (!row) return;
        const id = row.dataset.id;
        const st = this.state.unlockState(id);

        if (st.unlocked) {
          this.synth.click();
          this.view.setLine(id);
          this.setTab('factory');
          this.refresh(true);
          return;
        }
        if (st.canUnlock) {
          this.state.unlockProduct(id);      // sound/toast via the event
          return;
        }
        this.synth.error();
        this.toast(st.levelMet
          ? 'Need ' + Format.money(st.cost) + ' to open this line'
          : 'Unlocks at level ' + st.levelRequired, 'warn');
      });

      // ---- buy-amount selector -------------------------------------
      this.dom.buyAmt.addEventListener('click', ev => {
        const btn = ev.target.closest('button');
        if (!btn) return;
        this.synth.click();
        this.buyAmount = btn.dataset.amt === 'max' ? 'max' : +btn.dataset.amt;
        [...this.dom.buyAmt.children].forEach(b =>
          b.classList.toggle('on', b === btn));
        this.refresh(true);
      });

      // ---- axis buy buttons ----------------------------------------
      this.dom.axisRows.addEventListener('click', ev => {
        const btn = ev.target.closest('.abuy');
        if (!btn) return;
        const axis = btn.closest('.arow').dataset.axis;
        const id = this.state.selectedLine;
        // quality is bought one star at a time, whatever the selector says
        const amt = axis === 'quality' ? 1 : this.buyAmount;
        const res = this.state.buyUpgrade(id, axis, amt);
        if (!res.bought) {
          this.synth.error();
          const cost = this.state.upgradeCost(id, axis, amt === 'max' ? 1 : amt);
          this.toast(isFinite(cost) ? 'Not enough cash' : 'Fully upgraded', 'warn');
        }
        this.refresh(true);
      });

      // ---- booster rows --------------------------------------------
      this.dom.boosterRows.addEventListener('click', ev => {
        const btn = ev.target.closest('.bcta');
        if (!btn) return;
        const id = btn.closest('.brow').dataset.id;
        const res = this.state.activateBooster(id);
        if (!res.ok) {
          this.synth.error();
          this.toast(res.reason === 'cooldown'
            ? 'Ready in ' + Format.time(res.wait) : 'Unavailable', 'warn');
        }
        this.refreshBoosters();
      });

      // ---- modals ---------------------------------------------------
      [this.dom.modalBoosters, this.dom.modalOffline].forEach(m => {
        m.addEventListener('click', ev => {
          if (ev.target === m || ev.target.closest('[data-close]')) {
            this.synth.click();
            this.closeModal(m);
          }
        });
      });
      this.dom.offCollect.addEventListener('click', () => {
        this.synth.money();
        this.closeModal(this.dom.modalOffline);
      });

      // ---- audio ----------------------------------------------------
      this.dom.mute.addEventListener('click', () => {
        const muted = this.synth.toggleMute();
        this.dom.muteIcon.textContent = muted ? '🔇' : '🔊';
        this.dom.mute.setAttribute('aria-pressed', String(muted));
        if (!muted) this.synth.click();
      });

      // ---- keyboard --------------------------------------------------
      global.addEventListener('keydown', ev => {
        if (ev.target && /^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
        const k = ev.key.toLowerCase();
        if (k === '1') this.setTab('products');
        else if (k === '2') this.setTab('factory');
        else if (k === '3') this.openModal('boosters');
        else if (k === 'm') this.dom.mute.click();
        else if (k === 'd') this.dom.diag.hidden = !this.dom.diag.hidden;
        else if (k === 'escape') {
          this.closeModal(this.dom.modalBoosters);
          this.closeModal(this.dom.modalOffline);
          this.setTab(null);
        }
      });
    }

    /* ================================================================= */
    /*  Event listeners — state → UI + audio                             */
    /* ================================================================= */
    bindState() {
      const s = this.state;

      s.on('upgrade', e => {
        this.synth.upgrade();
        const axis = P.getAxis(e.axis);
        this.floatText(axis.short + ' +' + e.levels, '#ffc832');
      });

      s.on('unlock', e => {
        this.synth.unlock();
        this.toast('New line online — ' + e.product.name, 'good');
        this.view.setLine(e.id);
        this.setTab('factory');
        this.refresh(true);
      });

      s.on('levelup', e => {
        this.synth.levelup();
        this.toast('Level ' + e.level, 'good');
        this.dom.level.parentElement.classList.add('pulse');
        setTimeout(() => this.dom.level.parentElement.classList.remove('pulse'), 900);
      });

      s.on('objective', e => {
        this.synth.objective();
        const r = e.reward || {};
        this.toast('✓ ' + e.name +
          (r.cash ? '  +' + Format.money(r.cash) : ''), 'good');
        this.refresh(true);
      });

      s.on('booster', e => {
        this.synth.upgrade();
        if (e.granted) {
          this.floatText('+' + Format.money(e.granted), '#7dffb0');
          this.toast(e.def.name + ' — banked ' + Format.money(e.granted), 'good');
        } else {
          this.toast(e.def.name + ' active', 'good');
        }
        this.refreshBoosters();
      });
    }

    /* ================================================================= */
    /*  Event listeners — world → audio/UI                               */
    /* ================================================================= */
    bindWorld() {
      const e = this.engine;

      // a part landing on the belt
      e.byTag('arm').forEach(arm => { arm.onPlace = () => this.synth.assembly(); });

      // an item reaching the end of a line reads as money
      e.byTag('conveyor').forEach(c => { c.onDeliver = () => this.synth.money(); });

      // a truck pulling out ships the manifest
      e.byTag('truck').forEach(t => {
        t.onDepart = truck => {
          this.synth.truck();
          const value = this.state.incomePerMinute() * (truck.wait / 60);
          if (value > 0) {
            this.floaters.push({
              gx: truck.px, gy: truck.laneY, gz: 1.9,
              text: '+' + Format.money(value), color: '#7dffb0',
              life: 0, max: 1.9
            });
          }
        };
      });

      // tapping the floor collapses the sheet — the factory is the focus
      e.onTileClick = () => { this.synth.click(); this.setTab(null); };

      // claim the screen-space pass for floaters
      e.onRender = (ctx, w, h) => this.drawFloaters(ctx, w, h);

      // tick after the economy and the binding
      const prev = e.onTick;
      e.onTick = (dt, time) => {
        if (prev) prev(dt, time);
        this.tick(dt);
      };
    }

    /* ================================================================= */
    /*  Frame                                                            */
    /* ================================================================= */
    tick(dt) {
      for (let i = this.floaters.length - 1; i >= 0; i--) {
        const f = this.floaters[i];
        f.life += dt;
        f.gz += dt * 0.55;
        if (f.life > f.max) this.floaters.splice(i, 1);
      }
      this._clock += dt;
      if (this._clock >= 0.1) { this._clock = 0; this.refresh(false); }
    }

    /** Screen-space text rising off the world — drawn after the camera pass. */
    drawFloaters(ctx, w, h) {
      if (!this.floaters.length) return;
      const iso = this.engine.iso, cam = this.engine.camera;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '700 13px "JetBrains Mono", ui-monospace, monospace';
      for (const f of this.floaters) {
        const k = f.life / f.max;
        const x = iso.x(f.gx, f.gy) * cam.zoom + cam.x;
        const y = iso.y(f.gx, f.gy, f.gz) * cam.zoom + cam.y;
        if (x < -80 || x > w + 80 || y < -60 || y > h + 60) continue;
        ctx.globalAlpha = k < 0.15 ? k / 0.15 : 1 - Math.pow((k - 0.15) / 0.85, 2);
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(4,7,11,.85)';
        ctx.strokeText(f.text, x, y);
        ctx.fillStyle = f.color;
        ctx.fillText(f.text, x, y);
      }
      ctx.restore();
    }

    /** Floater pinned to the middle of the view (for UI-origin events). */
    floatText(text, color) {
      const g = this.engine;
      const c = g.iso.unproject((g.viewW / 2 - g.camera.x) / g.camera.zoom,
        (g.viewH * 0.42 - g.camera.y) / g.camera.zoom, 0);
      this.floaters.push({
        gx: c.gx, gy: c.gy, gz: 0.6, text, color: color || '#ffc832',
        life: 0, max: 1.5
      });
    }

    /* ================================================================= */
    /*  Refresh                                                          */
    /* ================================================================= */
    refresh(structural) {
      const s = this.state;

      this.dom.cash.textContent = Format.money(s.cash);
      this.dom.rate.textContent = Format.rate(s.incomePerMinute());
      this.dom.level.textContent = s.level;
      this.dom.xp.style.width = (s.xpProgress() * 100).toFixed(1) + '%';

      this.refreshObjective();
      this.refreshProducts(structural);
      this.refreshAxes();
      this.refreshBoosters();
      this.refreshBoostStrip();
    }

    refreshObjective() {
      const o = this.state.activeObjectives(1)[0];
      const d = this.dom;
      if (!o) {
        d.objName.textContent = 'All objectives complete';
        d.objFill.style.width = '100%';
        d.objCount.textContent = '';
        d.objReward.textContent = '';
        return;
      }
      d.objName.textContent = o.name + ' — ' + o.desc;
      d.objFill.style.width = (o.progress * 100).toFixed(1) + '%';
      d.objCount.textContent = o.label;
      d.objReward.textContent = o.reward && o.reward.cash
        ? '+' + Format.money(o.reward.cash) : '';
    }

    refreshProducts(structural) {
      const s = this.state;
      let unlocked = 0;
      P.PRODUCTS.forEach(p => {
        const r = this._rows.product.get(p.id);
        const line = s.line(p.id);
        const st = s.unlockState(p.id);
        if (st.unlocked) unlocked++;

        r.row.classList.toggle('locked', !st.unlocked);
        r.row.classList.toggle('ready', !st.unlocked && st.canUnlock);
        r.row.classList.toggle('active', s.selectedLine === p.id && st.unlocked);

        if (st.unlocked) {
          r.stars.textContent = Format.stars(line.quality);
          r.sub.textContent = Format.num(s.throughputPerMinute(p.id)) + ' u/min · ' +
            Format.money(s.valuePerUnit(p.id)) + '/unit';
          r.rate.textContent = Format.rate(s.lineIncomePerMinute(p.id));
          r.cta.textContent = s.selectedLine === p.id ? 'ACTIVE' : 'VIEW';
        } else {
          r.stars.textContent = '';
          r.sub.textContent = p.blurb;
          r.rate.textContent = st.levelMet ? Format.money(p.unlockCost) : '';
          r.cta.textContent = st.levelMet
            ? (st.affordable ? 'UNLOCK' : Format.money(p.unlockCost))
            : 'LV ' + p.unlockLv;
        }
      });
      this.dom.linesNote.textContent = unlocked + ' / ' + P.PRODUCTS.length + ' lines';
      if (structural) this.refreshFactoryHead();
    }

    refreshFactoryHead() {
      const s = this.state, id = s.selectedLine, p = s.product(id);
      if (!p) return;
      this.dom.factoryTitle.textContent = p.name;
      this.dom.lineSummary.innerHTML =
        '<span><b>' + Format.rate(s.lineIncomePerMinute(id)) + '</b>income</span>' +
        '<span><b>' + Format.num(s.throughputPerMinute(id)) + '</b>units/min</span>' +
        '<span><b>' + Format.money(s.valuePerUnit(id)) + '</b>per unit</span>' +
        '<span><b>' + Format.num(s.line(id).shipped) + '</b>shipped</span>';
    }

    refreshAxes() {
      const s = this.state, id = s.selectedLine;
      const line = s.line(id);
      if (!line) return;
      this.refreshFactoryHead();

      // share of the line's volume, so each bar means something
      const vol = ['speed', 'supply', 'robot']
        .reduce((t, a) => t + P.axisMultiplier(a, line[a]), 0);

      P.AXES.forEach(a => {
        const r = this._rows.axis.get(a.id);
        const lvl = line[a.id];
        const mult = P.axisMultiplier(a.id, lvl);
        const stars = a.kind === 'stars';
        const amt = stars ? 1 : this.buyAmount;

        r.lvl.textContent = stars ? Format.stars(lvl) : 'Lv ' + lvl;
        r.mult.textContent = stars ? '×' + mult.toFixed(2) + ' value'
          : '×' + mult.toFixed(2) + ' rate';
        r.meter.style.width = (stars ? lvl / 5 : mult / vol) * 100 + '%';

        const maxed = lvl >= a.max;
        let cost = Infinity, levels = 0;
        if (!maxed) {
          if (amt === 'max') {
            const plan = P.axisAffordable(s.product(id), a.id, lvl, s.cash, a.max - lvl);
            cost = plan.cost; levels = plan.levels;
          } else {
            const plan = P.axisBulkCost(s.product(id), a.id, lvl, amt);
            cost = plan.cost; levels = plan.levels;
          }
        }
        const afford = !maxed && levels > 0 && cost <= s.cash;
        r.buy.textContent = maxed ? 'MAX'
          : (amt === 'max'
            ? (levels > 0 ? '+' + levels + '  ' + Format.money(cost) : 'MAX BUY')
            : (stars ? '★ ' : '×' + amt + '  ') + Format.money(cost));
        r.buy.classList.toggle('afford', afford);
        r.buy.disabled = maxed;
        r.row.classList.toggle('maxed', maxed);
      });
    }

    refreshBoosters() {
      this.state.boosterViews().forEach(v => {
        const r = this._rows.booster.get(v.id);
        if (!r) return;
        r.row.classList.toggle('active', v.active);
        r.row.classList.toggle('cooling', !v.active && v.cooling);
        if (v.active) {
          r.cta.textContent = Format.time(v.remaining);
          r.meter.style.width = (v.activeProgress * 100).toFixed(1) + '%';
        } else if (v.cooling) {
          r.cta.textContent = Format.time(v.cooldown);
          r.meter.style.width = (v.cooldownProgress * 100).toFixed(1) + '%';
        } else {
          r.cta.textContent = 'ACTIVATE';
          r.meter.style.width = '100%';
        }
        r.cta.classList.toggle('afford', v.ready);
      });
    }

    /** Pills under the header for whatever is currently running. */
    refreshBoostStrip() {
      const active = this.state.boosterViews().filter(v => v.active);
      const strip = this.dom.boostStrip;
      const key = active.map(v => v.id + Math.ceil(v.remaining)).join(',');
      if (key === this._stripKey) return;
      this._stripKey = key;
      strip.innerHTML = '';
      active.forEach(v => {
        const pill = make('span', 'boost-pill',
          v.def.icon + ' ' + v.def.name + ' <b>' + Format.time(v.remaining) + '</b>');
        pill.style.setProperty('--c', v.def.tone);
        strip.appendChild(pill);
      });
    }

    /* ================================================================= */
    /*  Chrome                                                           */
    /* ================================================================= */
    setTab(name, silent) {
      this.tab = name;
      const sheet = this.dom.sheet;
      sheet.classList.toggle('open', !!name);
      for (const k in this.dom.panels) this.dom.panels[k].hidden = (k !== name);
      [...this.dom.tabs.children].forEach(b =>
        b.classList.toggle('on', b.dataset.tab === name));
      if (name && !silent) this.refresh(true);
    }

    openModal(which) {
      const m = which === 'boosters' ? this.dom.modalBoosters : this.dom.modalOffline;
      if (which === 'boosters') this.refreshBoosters();
      m.hidden = false;
      requestAnimationFrame(() => m.classList.add('in'));
    }

    closeModal(m) {
      if (!m || m.hidden) return;
      m.classList.remove('in');
      setTimeout(() => { m.hidden = true; }, 180);
    }

    showOffline(report) {
      this.dom.offAway.textContent = 'Your factory ran for ' + Format.time(report.away) +
        ' while you were away.';
      this.dom.offAmount.textContent = Format.money(report.earned);
      this.dom.offFine.textContent =
        Format.pct(report.efficiency) + ' of the ' +
        Format.rate(report.ratePerMinute) + ' line rate' +
        (report.capped ? ' · capped at ' + report.capHours + 'h' : '') +
        ' · ' + Format.num(report.units) + ' units shipped';
      this.openModal('offline');
    }

    toast(text, kind) {
      const t = make('div', 'toast' + (kind ? ' ' + kind : ''), text);
      this.dom.toasts.appendChild(t);
      requestAnimationFrame(() => t.classList.add('in'));
      setTimeout(() => {
        t.classList.remove('in');
        setTimeout(() => t.remove(), 260);
      }, 2600);
      while (this.dom.toasts.children.length > 4) this.dom.toasts.firstChild.remove();
    }
  }

  /* =================================================================== */
  function boot() {
    const engine = global.GAME, state = global.STATE, view = global.VIEW;
    if (!engine || !state || !view) {
      console.error('[isofactory] UI booted before the game was ready');
      return null;
    }
    const synth = new global.AUDIO.Synth();
    synth.unlockOnGesture();

    const ui = new GameUI(engine, state, view, synth);
    global.UI = ui;
    global.SYNTH = synth;
    return ui;
  }

  global.GAMEUI = { GameUI, boot };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(window);
</script>
</body>
</html>
